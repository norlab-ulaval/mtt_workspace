x-build: &mtt_devel_build
  context: ../..
  dockerfile: docker/Dockerfile
  target: devel
  args:
    ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    USERNAME: mtt
    USER_UID: ${UID:-1000}
    USER_GID: ${GID:-1000}

x-isaac-build: &isaac_build
  context: ../..
  dockerfile: docker/Dockerfile.isaac
  args:
    BASE_IMAGE: ${ISAAC_BASE_IMAGE:-${MTT_IMAGE:-mtt_workspace:devel}}
    ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    USERNAME: mtt
    ISAAC_ROS_APT_RELEASE: ${ISAAC_ROS_APT_RELEASE:-release-4.5}
    ISAAC_ROS_APT_URL: ${ISAAC_ROS_APT_URL:-https://isaac.download.nvidia.com/isaac-ros}
    NVIDIA_JETSON_APT_URL: ${NVIDIA_JETSON_APT_URL:-https://repo.download.nvidia.com/jetson/x86_64/noble}
    NVIDIA_JETSON_APT_SUITE: ${NVIDIA_JETSON_APT_SUITE:-r38.4}
    ISAAC_APT_PACKAGES: ${ISAAC_APT_PACKAGES:-}

x-live-robot-base: &live_robot_base
  extends:
    file: ../../docker/common.yaml
    service: ros_runtime_base
  env_file:
    - ../../.env
    - ./config/runtime.env
  image: ${MTT_IMAGE:-mtt_workspace:devel}
  build: *mtt_devel_build
  pull_policy: never
  privileged: true
  environment:
    ROS_DOMAIN_ID: ${LIVE_ROBOT_DOMAIN_ID:-2}
    RMW_IMPLEMENTATION: ${MTT_RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
    ROBOT_NAME: ${ROBOT_NAME:-mtt-hl}
    NORLAB_ROBOT_PATH: ${WORKSPACE}/src/external/norlab_robot
    ZENOH_ROUTER_CONFIG_URI: ${WORKSPACE}/src/external/norlab_robot/scripts/config/zenoh_router.json5
    ZENOH_SESSION_CONFIG_URI: ${WORKSPACE}/src/external/norlab_robot/scripts/config/zenoh_session.json5
    RMW_ZENOH_CONFIG_FILE: ${WORKSPACE}/src/external/norlab_robot/scripts/config/zenoh_session.json5
    RUST_LOG: ${ZENOH_RUST_LOG:-zenoh=info,zenoh_transport=warn}
    FIELD_NETWORK_MODE: ${FIELD_NETWORK_MODE:-false}
    DOODLE_ROBOT_IP: ${DOODLE_ROBOT_IP:-192.168.50.2}
    DOODLE_PC_IP: ${DOODLE_PC_IP:-192.168.50.101}
    ZENOH_FIELD_PORT: ${ZENOH_FIELD_PORT:-7447}
    FOXGLOVE_BIND_ADDRESS: ${FOXGLOVE_BIND_ADDRESS:-192.168.50.2}
    FOXGLOVE_PARAMS_FILE: ${FOXGLOVE_PARAMS_FILE:-${WORKSPACE}/demos/live_robot/config/foxglove_bridge.yaml}
    FOXGLOVE_FIELD_PARAMS_FILE: ${FOXGLOVE_FIELD_PARAMS_FILE:-${WORKSPACE}/src/external/norlab_robot/config/_foxglove_bridge_field_light.yaml}
    DRIVER_PARAMS_FILE: ${WORKSPACE}/demos/common/config/mtt_driver.yaml
    HEALTH_PARAMS_FILE: ${WORKSPACE}/demos/common/config/mtt_health_monitor.yaml
    CONTROL_PARAMS_FILE: ${WORKSPACE}/demos/common/config/mtt_control.yaml
    # FOLLOWER_PARAMS_FILE removed: wiln_path_follower (C++) reads wiln_params_file,
    # not a separate follower config. mtt_path_follower.yaml is dead and would create
    # a second controller/cmd_vel publisher if wired.
    SUPERVISOR_PARAMS_FILE: ${WORKSPACE}/demos/common/config/mtt_repeat_supervisor.yaml
    ROUTE_MANAGER_PARAMS_FILE: ${WORKSPACE}/demos/common/config/mtt_route_manager.yaml
    FRONT_OBSTACLE_PARAMS_FILE: ${WORKSPACE}/demos/common/config/mtt_front_obstacle_monitor.yaml
    WILN_PARAMS_FILE: ${WORKSPACE}/demos/common/config/wiln.yaml
    # WILN uses its private input to the always-on WILN/GPS autonomy mux.
    WILN_FOLLOWER_CMD_TOPIC: ${WILN_FOLLOWER_CMD_TOPIC:-/mtt_control/auto/wiln/cmd_vel}
    WILN_EXTERNAL_COMMAND_MUX: ${WILN_EXTERNAL_COMMAND_MUX:-false}
  volumes:
    - /dev:/dev
    - /run/udev:/run/udev:ro
    # ZED calibration and AI models persist across container restarts.
    # The ZED SDK downloads models on first run (requires internet).
    - /usr/local/zed/settings:/usr/local/zed/settings:rw
    - /usr/local/zed/resources:/usr/local/zed/resources:rw

x-isaac-base: &isaac_base
  extends:
    file: ../../docker/common.yaml
    service: ros_runtime_base
  env_file:
    - ../../.env
    - ./config/runtime.env
  image: ${ISAAC_ROS_IMAGE:-mtt_workspace:isaac}
  build: *isaac_build
  pull_policy: never
  privileged: true
  environment:
    ROS_DOMAIN_ID: ${LIVE_ROBOT_DOMAIN_ID:-2}
    RMW_IMPLEMENTATION: ${ISAAC_RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
    ROBOT_NAME: ${ROBOT_NAME:-mtt-hl}
    NORLAB_ROBOT_PATH: ${WORKSPACE}/src/external/norlab_robot
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
  volumes:
    - /dev:/dev
    - /run/udev:/run/udev:ro
    - /usr/local/zed/settings:/usr/local/zed/settings:rw
    - /usr/local/zed/resources:/usr/local/zed/resources:rw
    - ${WORKSPACE}/data:${WORKSPACE}/data

services:
  bash:
    <<: [*live_robot_base]
    profiles: ["debug"]
    tty: true
    stdin_open: true
    command: bash

  zenoh:
    <<: [*live_robot_base]
    # No profile → starts automatically with dc up.
    # The robot service depends on it so the router is up before ROS nodes connect.
    command:
      - bash
      - -c
      - |
        fuser -k 7447/tcp 2>/dev/null || true
        sleep 0.5
        if [ "$${FIELD_NETWORK_MODE:-false}" = "true" ]; then
          cfg="/tmp/zenoh_router_field_doodle.json5"
          sed \
            -e "s|__ROBOT_DOODLE_IP__|$${DOODLE_ROBOT_IP}|g" \
            -e "s|__ZENOH_PORT__|$${ZENOH_FIELD_PORT:-7447}|g" \
            "$${WORKSPACE}/src/external/norlab_robot/scripts/config/zenoh_router_field_doodle.template.json5" > "$${cfg}"
          export ZENOH_ROUTER_CONFIG_URI="$${cfg}"
          echo "FIELD_NETWORK_MODE=true: Zenoh router listening on tcp/$${DOODLE_ROBOT_IP}:$${ZENOH_FIELD_PORT:-7447}"
        else
          echo "FIELD_NETWORK_MODE=false: Zenoh router using $${ZENOH_ROUTER_CONFIG_URI}"
        fi
        exec ros2 run rmw_zenoh_cpp rmw_zenohd

  # ── Robot driver (CAN + odometry + operator control) ──
  # Launches description (URDF/TF) + CAN setup + driver + joystick/teleop.
  # Sensors and mapping are separate restartable services below.
  # Restart individually:
  #   docker compose restart robot_driver   — restarts driver only
  #   docker compose restart sensors        — restarts all sensors
  #   docker compose restart mapping        — restarts ICP mapper
  robot_driver:
    <<: [*live_robot_base]
    privileged: true
    depends_on:
      zenoh:
        condition: service_started
    volumes:
      - /dev:/dev
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro
      - /usr/local/zed/settings:/usr/local/zed/settings:rw
      - /dev/bus/usb:/dev/bus/usb
    command:
      - bash
      - -lc
      - |
        echo "=== robot_driver: CAN + odometry + operator control ==="
        echo "  driver:  $${DRIVER_PARAMS_FILE}"
        echo "  health:  $${HEALTH_PARAMS_FILE}"
        echo "  control: $${CONTROL_PARAMS_FILE}"
        echo "  teleop=$${ENABLE_TELEOP} joystick=$${ENABLE_JOYSTICK} joy_device=$${JOYSTICK_DEVICE}"
        exec ros2 launch norlab_robot live_robot.launch.py \
          warnings:=false \
          enable_description:=false \
          enable_sensors:=false \
          enable_mapping:=false \
          enable_perception:=false \
          enable_cloud_merger:=false \
          enable_teleop:=$${ENABLE_TELEOP} \
          enable_joystick:=$${ENABLE_JOYSTICK} \
          setup_real_can:=true \
          driver_params_file:=$${DRIVER_PARAMS_FILE} \
          health_params_file:=$${HEALTH_PARAMS_FILE} \
          control_params_file:=$${CONTROL_PARAMS_FILE} \
          joy_device:=$${JOYSTICK_DEVICE} \
          joy_deadzone:=$${JOYSTICK_DEADZONE}

  # ── Robot description (URDF / TF) ──
  # Uses source URDF + calibration xacro so TF is always up-to-date with mtt_core changes.
  # CALIBRATION selects the cage position: v1 (pre-displacement) or v2 (post-displacement, current).
  # Default is v2 — the cage has been permanently displaced since 2026-06-25.
  description:
    <<: [*live_robot_base]
    environment:
      CALIBRATION: ${CALIBRATION:-v2}
      USE_SIM_TIME: "false"
    depends_on:
      robot_driver:
        condition: service_started
    command:
      - ros2
      - launch
      - ${WORKSPACE}/demos/bag_replay/launch/description_calib.launch.py

  # ── Sensors (LiDAR + IMU + optional GPS/OAK) ──
  # Launches Hesai XT-32 + RS-Airy + MTi-100 and optional peripherals.
  # Standalone sensors.launch.py — does NOT touch CAN or description.
  # Restart without killing the driver:  docker compose restart sensors
  sensors:
    <<: [*live_robot_base]
    privileged: true
    depends_on:
      robot_driver:
        condition: service_started
    volumes:
      - /dev:/dev
      - /dev/bus/usb:/dev/bus/usb
      - /run/udev:/run/udev:ro
      - /usr/local/zed/settings:/usr/local/zed/settings:rw
      - /usr/local/zed/resources:/usr/local/zed/resources:rw
    command:
      - bash
      - -lc
      - |
        echo "=== sensors: LiDAR + IMU + optional peripherals ==="
        echo "  gps=$${ENABLE_GPS:-false} oak=$${ENABLE_OAK:-false} mti10=$${ENABLE_MTI10:-false}"
        ZED_ARGS=()
        if [ -n "$${ZED_PARAMS_OVERRIDE_PATH:-}" ]; then
          ZED_ARGS+=(zed_params_override_path:="$${ZED_PARAMS_OVERRIDE_PATH}")
          echo "  zed override: $${ZED_PARAMS_OVERRIDE_PATH}"
        elif [ "$${ZED_PROFILE:-field}" = "isaac" ]; then
          ZED_ARGS+=(zed_params_override_path:="$${WORKSPACE}/src/external/norlab_robot/config/_zed2i_isaac.yaml")
          echo "  zed profile: isaac"
        fi
        # zed_left_camera_frame -> zed_imu_link static TF (SDK-calibrated),
        # needed by Isaac VSLAM VIO mode. Only a launch ARGUMENT can set this
        # (see sensors.launch.py comment) -- a ZED params override YAML cannot.
        # Default true (was false) since 2026-07-27: isaac_vslam is now a
        # default service and needs the real calibrated extrinsic to fuse
        # IMU correctly, regardless of ZED_PROFILE (deliberately NOT
        # defaulted to "isaac" -- that profile's NEURAL_LIGHT depth mode
        # needs GPU/CUDA, which this TF publish does not: it just broadcasts
        # a static transform already loaded from the SDK's own calibration,
        # zero extra compute). Harmless when isaac_vslam isn't running.
        if [ "$${ZED_PUBLISH_IMU_TF:-true}" = "true" ] || [ "$${ZED_PROFILE:-field}" = "isaac" ]; then
          ZED_ARGS+=(zed_publish_imu_tf:=true)
        fi
        exec ros2 launch norlab_robot sensors.launch.py \
          warnings:=false \
          enable_gps:=$${ENABLE_GPS:-false} \
          enable_oak:=$${ENABLE_OAK:-false} \
          enable_mti10:=$${ENABLE_MTI10:-false} \
          gps_mode:=$${GPS_MODE} \
          gps_antennas:=$${GPS_ANTENNAS} \
          "$${ZED_ARGS[@]}"

  isaac_preflight:
    <<: [*isaac_base]
    profiles: ["isaac", "check"]
    depends_on:
      - sensors
    command:
      - bash
      - -lc
      - |
        source /opt/ros/$${ROS_DISTRO:-jazzy}/setup.bash
        [ -f "$${WORKSPACE}/install/setup.bash" ] && source "$${WORKSPACE}/install/setup.bash"
        [ -f /opt/isaac_ros_ws/install/setup.bash ] && source /opt/isaac_ros_ws/install/setup.bash

        echo "=== GPU ==="
        if command -v nvidia-smi >/dev/null 2>&1; then
          nvidia-smi || true
        else
          echo "nvidia-smi not installed in this container."
          test -r /proc/driver/nvidia/version && cat /proc/driver/nvidia/version || true
          ls -l /dev/nvidia* 2>/dev/null || true
        fi
        echo "NVIDIA_VISIBLE_DEVICES=$${NVIDIA_VISIBLE_DEVICES:-}"
        echo "NVIDIA_DRIVER_CAPABILITIES=$${NVIDIA_DRIVER_CAPABILITIES:-}"

        echo
        echo "=== Isaac packages ==="
        ros2 pkg list | grep -E 'isaac|nvblox' || true

        echo
        echo "=== Required input topics ==="
        duration="$${ISAAC_AUDIT_DURATION:-5}"
        for topic in \
          /zed/zed_node/left/gray/rect/image \
          /zed/zed_node/left/gray/rect/camera_info \
          /zed/zed_node/rgb/color/rect/image \
          /zed/zed_node/rgb/color/rect/camera_info \
          /zed/zed_node/depth/depth_registered \
          /zed/zed_node/depth/depth_registered/camera_info \
          /zed/zed_node/imu/data \
          /hesai_lidar/points
        do
          echo "--- $${topic}"
          ros2 topic info "$${topic}" || true
          timeout "$${duration}s" ros2 topic hz "$${topic}" || true
        done

        echo
        echo "=== Isaac outputs ==="
        for topic in /isaac/vslam/odometry /isaac/vslam/status /isaac/nvblox/static_map_slice /isaac/nvblox/mesh; do
          echo "--- $${topic}"
          ros2 topic info "$${topic}" || true
        done

  isaac_vslam:
    <<: [*isaac_base]
    # No profiles: -- default service as of 2026-07-27 (was profiles:
    # ["isaac"], opt-in). Requires the mtt_workspace:isaac sidecar image
    # (built via `docker compose --profile isaac build isaac_vslam` if
    # missing -- `build:` in isaac_base can also build it on first `up`,
    # which adds real startup time/network dependency on a fresh machine).
    depends_on:
      - sensors
      - description
    command:
      - bash
      - -lc
      - |
        source /opt/ros/$${ROS_DISTRO:-jazzy}/setup.bash
        [ -f "$${WORKSPACE}/install/setup.bash" ] && source "$${WORKSPACE}/install/setup.bash"
        [ -f /opt/isaac_ros_ws/install/setup.bash ] && source /opt/isaac_ros_ws/install/setup.bash

        # ISAAC_VSLAM_MODE=vio (default since 2026-07-27: stereo + ZED IMU
        # fusion, see isaac_vslam_vio.yaml) or =rgbd (camera+depth, no IMU
        # fusion -- see isaac_vslam_rgbd.yaml header). rgbd is currently
        # BROKEN on this hardware/release (cuVSLAM 15.0.0, release-4.5): 4
        # parameter combinations tried 2026-07-26, all failed (error / silent
        # hang / segfault) -- do not default back to it without fixing that
        # first. isaac_ros_visual_slam release-4.5 only computes the
        # camera<->IMU extrinsic and fuses IMU when tracking_mode==VIO; the
        # two modes are mutually exclusive, not stackable.
        mode="$${ISAAC_VSLAM_MODE:-vio}"
        if [ "$${mode}" = "vio" ]; then
          params_file="$${ISAAC_VSLAM_PARAMS_FILE:-$${WORKSPACE}/demos/common/config/isaac_vslam_vio.yaml}"
        else
          params_file="$${ISAAC_VSLAM_PARAMS_FILE:-$${WORKSPACE}/demos/common/config/isaac_vslam_rgbd.yaml}"
        fi
        # RGBD wants the RAW (unrectified) left image -- cuVSLAM rectifies
        # internally in that mode (see isaac_vslam_rgbd.yaml). VIO genuinely
        # needs pre-rectified stereo (matches NVIDIA's own VIO reference).
        if [ "$${mode}" = "vio" ]; then
          image_topic="$${ISAAC_VSLAM_IMAGE_TOPIC:-/zed/zed_node/left/gray/rect/image}"
          camera_info_topic="$${ISAAC_VSLAM_CAMERA_INFO_TOPIC:-/zed/zed_node/left/gray/rect/camera_info}"
        else
          image_topic="$${ISAAC_VSLAM_IMAGE_TOPIC:-/zed/zed_node/left/gray/raw/image}"
          camera_info_topic="$${ISAAC_VSLAM_CAMERA_INFO_TOPIC:-/zed/zed_node/left/gray/raw/camera_info}"
        fi
        depth_topic="$${ISAAC_VSLAM_DEPTH_TOPIC:-/zed/zed_node/depth/depth_registered}"
        depth_info_topic="$${ISAAC_VSLAM_DEPTH_INFO_TOPIC:-/zed/zed_node/depth/depth_registered/camera_info}"
        imu_topic="$${ISAAC_VSLAM_IMU_TOPIC:-/zed/zed_node/imu/data}"
        if [ "$${mode}" = "vio" ]; then
          image_right_topic="$${ISAAC_VSLAM_IMAGE_RIGHT_TOPIC:-/zed/zed_node/right/gray/rect/image}"
          camera_info_right_topic="$${ISAAC_VSLAM_CAMERA_INFO_RIGHT_TOPIC:-/zed/zed_node/right/gray/rect/camera_info}"
        else
          image_right_topic="$${ISAAC_VSLAM_IMAGE_RIGHT_TOPIC:-/zed/zed_node/right/gray/raw/image}"
          camera_info_right_topic="$${ISAAC_VSLAM_CAMERA_INFO_RIGHT_TOPIC:-/zed/zed_node/right/gray/raw/camera_info}"
        fi

        if ! ros2 pkg prefix isaac_ros_visual_slam >/dev/null 2>&1; then
          echo "ERROR: isaac_ros_visual_slam is not installed in this container."
          echo "Set ISAAC_ROS_IMAGE to a sidecar image containing Isaac ROS Visual SLAM."
          exit 42
        fi
        if ! ros2 pkg executables isaac_ros_visual_slam | grep -qE '(^| )isaac_ros_visual_slam$$'; then
          echo "ERROR: isaac_ros_visual_slam executable not found."
          ros2 pkg executables isaac_ros_visual_slam || true
          exit 43
        fi

        echo "=== Isaac Visual SLAM ($${mode}) ==="
        echo "params: $${params_file}"
        echo "image:  $${image_topic}"
        echo "imu:    $${imu_topic}"
        echo "Waiting for ZED topics to settle..."
        sleep 5
        if [ "$${mode}" = "vio" ]; then
          echo "image_1: $${image_right_topic}"
          # DISABLED 2026-07-26: isaac_vslam_frame_bridge.py used to publish
          # hesai_lidar -> isaac_map, but norlab_icp_mapper_ros's mapper_node
          # ALSO claims isaac_map's parent (it broadcasts map -> odom_frame,
          # and odom_frame was set to isaac_map) -- two broadcasters, same
          # child, the exact conflict this script was written to avoid, just
          # moved one frame over. Confirmed via `view_frames` inside the
          # mapping container: "isaac_map: parent: 'map'" (the mapper) racing
          # this script's "isaac_map: parent: 'hesai_lidar'".
          # mapper_node.cpp has no topic-based prior input (only TF), and
          # every URDF frame between isaac_odom and base_footprint already
          # has a real parent (hesai_lidar owns zed_camera_link, odom owns
          # base_footprint) -- there is no free TF attachment point left for
          # an Isaac-derived ICP prior without a mapper code change or
          # replacing the wheel-odom TF source outright. Left disabled;
          # MAPPING_ODOM_FRAME reverted to "odom" (default, conflict-free).
          # python3 "$${WORKSPACE}/scripts/isaac_vslam_frame_bridge.py" &
          # zed_left_camera_frame -> zed_imu_link is published by the ZED node
          # itself (real SDK-calibrated camera_imu_transform), enabled via the
          # sensors service's zed_publish_imu_tf launch argument (see
          # sensors.launch.py) -- root-caused and fixed 2026-07-26, no
          # workaround TF needed here anymore.
          exec ros2 run isaac_ros_visual_slam isaac_ros_visual_slam \
            --ros-args \
            --params-file "$${params_file}" \
            -r visual_slam/image_0:="$${image_topic}" \
            -r visual_slam/camera_info_0:="$${camera_info_topic}" \
            -r visual_slam/image_1:="$${image_right_topic}" \
            -r visual_slam/camera_info_1:="$${camera_info_right_topic}" \
            -r visual_slam/imu:="$${imu_topic}" \
            -r visual_slam/tracking/odometry:=/isaac/vslam/odometry \
            -r visual_slam/tracking/slam_path:=/isaac/vslam/slam_path \
            -r visual_slam/tracking/vo_path:=/isaac/vslam/vo_path \
            -r visual_slam/status:=/isaac/vslam/status \
            -r visual_slam/vis/landmarks_cloud:=/isaac/vslam/landmarks_cloud \
            -r visual_slam/vis/observations_cloud:=/isaac/vslam/observations_cloud
        else
          echo "depth:  $${depth_topic}"
          echo "image_1 (test: num_cameras=2 may need a real pair, not just image+depth): $${image_right_topic}"
          exec ros2 run isaac_ros_visual_slam isaac_ros_visual_slam \
            --ros-args \
            --params-file "$${params_file}" \
            -r visual_slam/image_0:="$${image_topic}" \
            -r visual_slam/camera_info_0:="$${camera_info_topic}" \
            -r visual_slam/image_1:="$${image_right_topic}" \
            -r visual_slam/camera_info_1:="$${camera_info_right_topic}" \
            -r visual_slam/depth_0:="$${depth_topic}" \
            -r visual_slam/depth_camera_info_0:="$${depth_info_topic}" \
            -r visual_slam/imu:="$${imu_topic}" \
            -r visual_slam/tracking/odometry:=/isaac/vslam/odometry \
            -r visual_slam/tracking/slam_path:=/isaac/vslam/slam_path \
            -r visual_slam/tracking/vo_path:=/isaac/vslam/vo_path \
            -r visual_slam/status:=/isaac/vslam/status \
            -r visual_slam/vis/landmarks_cloud:=/isaac/vslam/landmarks_cloud \
            -r visual_slam/vis/observations_cloud:=/isaac/vslam/observations_cloud
        fi

  isaac_nvblox:
    <<: [*isaac_base]
    profiles: ["isaac"]
    depends_on:
      - sensors
      - description
      - isaac_vslam
    command:
      - bash
      - -lc
      - |
        source /opt/ros/$${ROS_DISTRO:-jazzy}/setup.bash
        [ -f "$${WORKSPACE}/install/setup.bash" ] && source "$${WORKSPACE}/install/setup.bash"
        [ -f /opt/isaac_ros_ws/install/setup.bash ] && source /opt/isaac_ros_ws/install/setup.bash

        params_file="$${ISAAC_NVBLOX_PARAMS_FILE:-$${WORKSPACE}/demos/common/config/isaac_nvblox_zed.yaml}"
        color_topic="$${ISAAC_NVBLOX_COLOR_TOPIC:-/zed/zed_node/rgb/color/rect/image}"
        color_info_topic="$${ISAAC_NVBLOX_COLOR_INFO_TOPIC:-/zed/zed_node/rgb/color/rect/camera_info}"
        depth_topic="$${ISAAC_NVBLOX_DEPTH_TOPIC:-/zed/zed_node/depth/depth_registered}"
        depth_info_topic="$${ISAAC_NVBLOX_DEPTH_INFO_TOPIC:-/zed/zed_node/depth/depth_registered/camera_info}"
        pointcloud_topic="$${ISAAC_NVBLOX_POINTCLOUD_TOPIC:-}"

        if ! ros2 pkg prefix nvblox_ros >/dev/null 2>&1; then
          echo "ERROR: nvblox_ros is not installed in this container."
          echo "Set ISAAC_ROS_IMAGE to a sidecar image containing Isaac ROS Nvblox."
          exit 44
        fi
        if ! ros2 pkg executables nvblox_ros | grep -qE '(^| )nvblox_node$$'; then
          echo "ERROR: nvblox_node executable not found."
          ros2 pkg executables nvblox_ros || true
          exit 45
        fi

        remaps=(
          -r camera_0/color/image:="$${color_topic}"
          -r camera_0/color/camera_info:="$${color_info_topic}"
          -r camera_0/depth/image:="$${depth_topic}"
          -r camera_0/depth/camera_info:="$${depth_info_topic}"
        )
        if [ -n "$${pointcloud_topic}" ]; then
          remaps+=(-r pointcloud:="$${pointcloud_topic}")
        fi

        echo "=== Isaac Nvblox ZED ==="
        echo "params: $${params_file}"
        echo "color:  $${color_topic}"
        echo "depth:  $${depth_topic}"
        [ -n "$${pointcloud_topic}" ] && echo "lidar:  $${pointcloud_topic}"
        echo "Waiting for Isaac/ZED topics to settle..."
        sleep 8
        exec ros2 run nvblox_ros nvblox_node \
          --ros-args \
          --params-file "$${params_file}" \
          "$${remaps[@]}" \
          -r __node:=isaac_nvblox \
          -r ~/mesh:=/isaac/nvblox/mesh \
          -r ~/mesh_marker:=/isaac/nvblox/mesh_marker \
          -r ~/tsdf_layer:=/isaac/nvblox/tsdf_layer \
          -r ~/color_layer:=/isaac/nvblox/color_layer \
          -r ~/static_esdf_pointcloud:=/isaac/nvblox/static_esdf_pointcloud \
          -r ~/static_map_slice:=/isaac/nvblox/static_map_slice \
          -r ~/back_projected_depth:=/isaac/nvblox/back_projected_depth

  # ── ICP Mapping ──
  # Norlab ICP mapper — restartable independently of sensors and driver.
  # Waits for LiDAR and odometry to be live before launching.
  # Restart without killing sensors:  docker compose restart mapping
  mapping:
    <<: [*live_robot_base]
    depends_on:
      robot_driver:
        condition: service_started
      sensors:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        echo "=== mapping: Norlab ICP mapper ==="
        echo "  points: $${MAPPING_POINTS_TOPIC:-/hesai_lidar/points}"
        echo "  config: $${MAPPING_CONFIG:-default}"
        echo "  deskew=$${MAPPING_DESKEW} voxel=$${MAPPING_COMPRESSION_VOXEL_SIZE}"
        POINTS_TOPIC="$${MAPPING_POINTS_TOPIC:-/hesai_lidar/points}"
        echo "Waiting for LiDAR ($${POINTS_TOPIC})..."
        for i in $$(seq 1 60); do
          ros2 topic info "$${POINTS_TOPIC}" 2>/dev/null | grep -qE "Publisher count: [1-9]" && break
          [ "$$i" -eq 60 ] && echo "  WARNING: $${POINTS_TOPIC} not available after 60s — launching anyway" && break
          echo "  ($$i/60) Waiting for $${POINTS_TOPIC}..."
          sleep 1
        done
        echo "Waiting for odometry (/mtt_odometry)..."
        for i in $$(seq 1 30); do
          ros2 topic info /mtt_odometry 2>/dev/null | grep -qE "Publisher count: [1-9]" && break
          [ "$$i" -eq 30 ] && echo "  WARNING: /mtt_odometry not available after 30s — launching anyway" && break
          echo "  ($$i/30) Waiting for /mtt_odometry..."
          sleep 1
        done
        DELAY="$${MAPPING_DELAY_SECONDS:-10}"
        [ "$${DELAY}" -gt 0 ] && {
          echo "  Startup delay: $${DELAY}s (set MAPPING_DELAY_SECONDS=0 to skip)"
          sleep "$${DELAY}"
        }
        exec ros2 launch norlab_robot mapping.launch.py \
          use_sim_time:=false \
          mapping_deskew:=$${MAPPING_DESKEW} \
          mapping_compression_voxel_size:=$${MAPPING_COMPRESSION_VOXEL_SIZE} \
          mapping_map_publish_rate:=$${MAPPING_MAP_PUBLISH_RATE} \
          mapping_map_tf_publish_rate:=$${MAPPING_MAP_TF_PUBLISH_RATE} \
          mapping_points_topic:=$${MAPPING_POINTS_TOPIC} \
          mapping_config:=$${MAPPING_CONFIG:-$${WORKSPACE}/src/external/norlab_robot/config/mapping/_config_hesai_imu_norlabws.yaml} \
          mapping_odom_frame:=$${MAPPING_ODOM_FRAME:-odom} \
          mapping_robot_frame:=$${MAPPING_ROBOT_FRAME:-base_footprint}

  # ── Perception (trailer detector + cloud merger) ──
  # Launches trailer_detector_node + trailer_pose_node.
  # cloud_merger_node is included only if ENABLE_CLOUD_MERGER=true (default: false).
  # Starts automatically with docker compose up -d.
  # ZED visualization scripts are separate services: zed_markers, zed_pose_viz
  perception:
    <<: [*live_robot_base]
    depends_on:
      robot_driver:
        condition: service_started
      sensors:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        echo "=== perception: trailer detector + cloud_merger=$${ENABLE_CLOUD_MERGER:-false} ==="
        exec ros2 launch mtt_perception perception.launch.py \
          use_sim_time:=false \
          enable_cloud_merger:=$${ENABLE_CLOUD_MERGER:-false}

  # ── ZED object detections → Foxglove markers ──
  # Converts zed_msgs/ObjectsStamped into visualization_msgs/MarkerArray.
  # Start with:  docker compose run --rm zed_markers
  zed_markers:
    <<: [*live_robot_base]
    profiles: ["perception"]
    depends_on:
      sensors:
        condition: service_started
    command:
      - python3
      - -u
      - ${WORKSPACE}/scripts/zed_objects_to_markers.py
      - --only-person

  # ── ZED pose path visualizer ──
  # Publishes ZED odometry as a nav_msgs/Path for Foxglove trail visualization.
  # Start with:  docker compose run --rm zed_pose_viz
  zed_pose_viz:
    <<: [*live_robot_base]
    profiles: ["perception"]
    depends_on:
      sensors:
        condition: service_started
    command:
      - python3
      - -u
      - ${WORKSPACE}/scripts/zed_pose_visualizer.py

  foxglove:
    <<: [*live_robot_base]
    profiles: ["infra"]
    depends_on:
      - robot_driver
    # network_mode: host (inherited) means the bridge binds on the robot host.
    # Keep this service opt-in so the default stack can reuse an existing host bridge.
    command:
      - bash
      - -lc
      - |
        if command -v fuser &>/dev/null; then
          fuser -k 8765/tcp 2>/dev/null || true
          sleep 0.5
        fi
        params_file="$${FOXGLOVE_PARAMS_FILE}"
        address_args=()
        if [ "$${FIELD_NETWORK_MODE:-false}" = "true" ]; then
          params_file="$${FOXGLOVE_FIELD_PARAMS_FILE}"
          address_args=(-p address:="$${FOXGLOVE_BIND_ADDRESS}")
          echo "FIELD_NETWORK_MODE=true: Foxglove binding $${FOXGLOVE_BIND_ADDRESS}:8765"
          echo "  Params: $${params_file}"
        fi
        exec ros2 run foxglove_bridge foxglove_bridge \
          --ros-args \
          --params-file "$${params_file}" \
          "$${address_args[@]}"

  # ── Localization: Factor Graph + Trailer Localizer ──
  # Runs mtt_localization/localization.launch.py (live, no sim time).
  # Launches two nodes:
  #   - factor_graph_node: ISAM2 tractor pose + optimised phi
  #     Publishes: /localization/odom (SE(3) with 6x6 covariance)
  #                /localization/articulation_angle (optimised phi, std_msgs/Float64)
  #   - mtt_trailer_localizer_node: trailer SE(3) pose in map
  #     Publishes: /trailer/odom, /trailer/pose_in_map, TF map->trailer_body
  #
  # Core live service: starts by default with `dc up`. The GPS follower remains
  # disarmed until /mtt_gps/replay is explicitly called and all gates are valid.
  localization:
    <<: [*live_robot_base]
    restart: unless-stopped
    depends_on:
      - mapping
    command:
      - bash
      - -lc
      - |
        echo "==================================================="
        echo " MTT Localization (Factor Graph + Trailer)"
        echo "==================================================="
        echo "Waiting for /mtt/articulation_state..."
        for i in $$(seq 1 60); do
          ros2 topic info /mtt/articulation_state 2>/dev/null | grep -qE "Publisher count: [1-9]" && break
          [ "$$i" -eq 60 ] && echo "  WARNING: /mtt/articulation_state not ready after 60s — launching anyway" && break
          echo "  ($$i/60) Waiting..."
          sleep 1
        done
        echo "Waiting for /mapping/icp_odom (Norlab ICP odom prior)..."
        for i in $$(seq 1 45); do
          ros2 topic info /mapping/icp_odom 2>/dev/null | grep -qE "Publisher count: [1-9]" && break
          [ "$$i" -eq 45 ] && echo "  WARNING: /mapping/icp_odom not ready after 45s — launching anyway" && break
          echo "  ($$i/45) Waiting..."
          sleep 1
        done
        echo "Starting localization + GPS Teach & Repeat services..."
        exec ros2 launch mtt_gps_teach_repeat gps_localization.launch.py \
          use_sim_time:=false \
          use_gps:=true \
          use_gps_heading:=false \
          gps_recorder_params_file:=$${GPS_RECORDER_PARAMS_FILE:-$${WORKSPACE}/demos/common/config/gps_recorder.yaml} \
          gps_path_server_params_file:=$${GPS_PATH_SERVER_PARAMS_FILE:-$${WORKSPACE}/demos/common/config/gps_path_server.yaml} \
          gps_path_follower_params_file:=$${GPS_PATH_FOLLOWER_PARAMS_FILE:-$${WORKSPACE}/demos/common/config/gps_path_follower.yaml} \
          front_obstacle_params_file:=$${FRONT_OBSTACLE_PARAMS_FILE}

  # ── GPS teach & repeat: recorder ──
  # Runs mtt_gps_teach_repeat/gps_recorder.launch.py — mtt_gps_recorder_node,
  # Legacy standalone recorder (localization already includes the unified GPS stack).
  # Do not start this together with localization.
  # Services: ~/start_recording, ~/stop_recording (Trigger) — wired to the
  # Foxglove GPS tab's record/stop buttons.
  #
  # Requires the "localization" service also running (different profile —
  # docker compose can't depends_on across a profile boundary, so this waits
  # on the topic instead) and a real anchor set — see "Setting the anchor"
  # in src/mtt_core/mtt_gps_teach_repeat/README.md.
  # Legacy only: `dc --profile gps up gps_recorder` (do not combine with localization).
  gps_recorder:
    <<: [*live_robot_base]
    profiles: ["gps"]
    command:
      - bash
      - -lc
      - |
        echo "Waiting for localization/odom..."
        for i in $$(seq 1 45); do
          ros2 topic info localization/odom 2>/dev/null | grep -qE "Publisher count: [1-9]" && break
          [ "$$i" -eq 45 ] && echo "  WARNING: localization/odom not ready after 45s — launching anyway" && break
          sleep 1
        done
        exec ros2 launch mtt_gps_teach_repeat gps_recorder.launch.py \
          gps_recorder_params_file:=$${GPS_RECORDER_PARAMS_FILE:-$${WORKSPACE}/demos/common/config/gps_recorder.yaml}

  # ── GPS teach & repeat: path server + follower ──
  # Runs mtt_gps_teach_repeat/gps_path_following.launch.py — matches the live
  # pose against a recorded route (mtt_gps_path_server_node) and drives the
  # Frenet-error control law (mtt_gps_path_follower_node). Same AUTO+deadman
  # safety contract as WILN. It may run together with wiln_path_follower: the
  # REPLAY services select one controller through the autonomy mux.
  # Requires "localization" also running — see gps_recorder's comment above.
  # Legacy only: `dc --profile gps up gps_path_following` (do not combine with localization).
  gps_path_following:
    <<: [*live_robot_base]
    profiles: ["gps"]
    command:
      - bash
      - -lc
      - |
        echo "Waiting for localization/odom..."
        for i in $$(seq 1 45); do
          ros2 topic info localization/odom 2>/dev/null | grep -qE "Publisher count: [1-9]" && break
          [ "$$i" -eq 45 ] && echo "  WARNING: localization/odom not ready after 45s — launching anyway" && break
          sleep 1
        done
        exec ros2 launch mtt_gps_teach_repeat gps_path_following.launch.py \
          gps_path_server_params_file:=$${GPS_PATH_SERVER_PARAMS_FILE:-$${WORKSPACE}/demos/common/config/gps_path_server.yaml} \
          gps_path_follower_params_file:=$${GPS_PATH_FOLLOWER_PARAMS_FILE:-$${WORKSPACE}/demos/common/config/gps_path_follower.yaml}

  # ── COM motor (EtherCAT stepper, optional) ──
  # Launches mtt_motor_driver (SOEM 1kHz RT) + mtt_motor_control (position).
  # Requires the CL86EC drive powered and the EtherCAT cable connected.
  # Start with: docker compose up --profile com
  #   or:       ENABLE_COM_MOTOR=true docker compose --profile com up
  #
  # COM_MOTOR_DRY_RUN=true  → test chain without hardware (echoes cmd→state)
  # COM_ETHERCAT_IFACE=enp3s0 → override auto-detected NIC
  com_motor:
    <<: [*live_robot_base]
    profiles: ["com"]
    user: root
    depends_on:
      robot_driver:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        echo "=== com_motor: CL86EC EtherCAT stepper driver + COM position controller ==="
        echo "  dry_run=$${COM_MOTOR_DRY_RUN:-false}  iface=$${COM_ETHERCAT_IFACE:-auto}"
        IFACE_ARG=""
        [ -n "$${COM_ETHERCAT_IFACE:-}" ] && IFACE_ARG="ethercat_ifname:=$${COM_ETHERCAT_IFACE}"
        exec ros2 launch mtt_motor_control com_motor.launch.py \
          dry_run:=$${COM_MOTOR_DRY_RUN:-false} \
          $$IFACE_ARG \
          auto_enable:=$${COM_MOTOR_AUTO_ENABLE:-true} \
          com_params:=$${COM_PARAMS_FILE:-$${WORKSPACE}/demos/common/config/com_motor.yaml}

  # ── Remote-safe LiDAR debug cloud ──
  # Publishes a small ROI/voxelized cloud for Foxglove field use. Mapping and
  # WILN still consume the raw Hesai cloud locally.
  lidar_debug_cloud:
    <<: [*live_robot_base]
    profiles: ["field", "debug"]
    depends_on:
      - sensors
    command:
      - python3
      - ${WORKSPACE}/scripts/pointcloud_voxel_debug.py
      - --ros-args
      - -p
      - input_topic:=${LIDAR_DEBUG_INPUT_TOPIC:-/hesai_lidar/points}
      - -p
      - output_topic:=${LIDAR_DEBUG_OUTPUT_TOPIC:-/debug/hesai_points_voxel}
      - -p
      - voxel_size:=${LIDAR_DEBUG_VOXEL_SIZE:-0.30}
      - -p
      - max_rate_hz:=${LIDAR_DEBUG_MAX_RATE_HZ:-2.0}
      - -p
      - max_points:=${LIDAR_DEBUG_MAX_POINTS:-25000}

  network_audit:
    <<: [*live_robot_base]
    profiles: ["check", "field", "debug"]
    command:
      - bash
      - -lc
      - |
        ${WORKSPACE}/scripts/audit_network_field.sh

  doodle_check:
    <<: [*live_robot_base]
    profiles: ["check", "field", "debug"]
    command:
      - bash
      - -lc
      - |
        ${WORKSPACE}/scripts/field_doodle_check.sh

  # ── LiDAR-Camera colorizer ──
  # Projects ZED2i RGB onto the Hesai PointCloud2 and publishes
  # /hesai_lidar/points_colored (keeps intensity + adds rgb field).
  # Usage: dc up --profile colorizer
  colorizer:
    <<: [*live_robot_base]
    profiles: ["colorizer"]
    depends_on:
      - sensors
    command:
      - bash
      - -lc
      - |
        echo "Waiting for sensors to settle..."
        sleep 5
        exec ros2 launch mtt_lidar_camera_colorizer colorizer.launch.py \
          use_sim_time:=false \
          image_transport:=raw

  rviz:
    <<: [*live_robot_base]
    profiles: ["viz"]
    depends_on:
      - robot_driver
    command:
      - ros2
      - launch
      - mtt_bringup
      - mtt_rviz.launch.py
      - use_sim_time:=false
      - rviz_config:=${WORKSPACE}/src/mtt_core/mtt_description/rviz/urdf_config.rviz

  teleop_robot:
    <<: [*live_robot_base]
    profiles: ["manual"]
    depends_on:
      - robot_driver
    command:
      - bash
      - -lc
      - |
        echo "teleop_robot is now a compatibility stub."
        echo "Joystick teleop already runs inside the base robot service."
        echo "Edit demos/live_robot/config/runtime.env and demos/common/config/mtt_control.yaml to change joystick behavior."

  wiln:
    <<: [*live_robot_base]
    restart: unless-stopped
    depends_on:
      - mapping
    command:
      - bash
      - -lc
      - |
        eval "$$($${WORKSPACE}/scripts/wiln_route_env.sh --mode load)"
        wait_for_topic() {
          topic="$$1"; timeout_s="$$2"; label="$$3"
          echo "Waiting for $$label ($$topic)..."
          for i in $$(seq 1 "$$timeout_s"); do
            ros2 topic info "$$topic" 2>/dev/null | grep -qE "Publisher count: [1-9]" && return 0
            sleep 1
          done
          echo "ERROR: $$label ($$topic) not available after $${timeout_s}s"
          return 1
        }
        wait_for_topic /mapping/icp_odom 45 "Norlab ICP odom" || exit 1
        wait_for_topic /mapping/map 45 "Norlab ICP map" || exit 1
        # /mapping/trajectory_path was a mohamed-fork-only visualization topic
        # (norlab_icp_mapper_ros switched to upstream ros2 2026-07-28, see
        # dependencies/robot.repos). Upstream mapper_node only ever publishes
        # map / scan_after_input_filters / scan_after_deskew / icp_odom — this
        # topic will never exist again. WILN itself only consumes
        # /mapping/icp_odom (wiln_path_follower.odom_topic in
        # demos/common/config/wiln.yaml) — nothing subscribes to
        # trajectory_path, it was Foxglove/rosbag decoration only. Non-fatal.
        wait_for_topic /mapping/trajectory_path 45 "Norlab ICP trajectory path" || true
        echo "Norlab ICP ready — starting teach/repeat stack"
        echo ""
        echo "  Fresh route:"
        echo "    dc run --rm wiln_teach_start     — start teaching"
        echo "    ... drive manually ..."
        echo "    dc run --rm wiln_teach_stop      — stop teaching, route armed in memory"
        echo "    dc run --rm route_replay         — replay through route safety checks"
        echo "    dc run --rm wiln_save            — optional, save to $${WILN_LTR_DIR}/route.ltr"
        echo "    dc run --rm route_check          — validate + preview saved route"
        echo ""
        echo "  Existing route:"
        echo "    dc run --rm wiln_load            — load from $${WILN_LTR_DIR}/route.ltr"
        echo "    dc run --rm route_replay         — replay loaded route"
        echo ""
        echo "  Diagnostics:"
        echo "    dc run --rm wiln_status"
        echo "    dc run --rm wiln_validate"
        echo "    dc run --rm wiln_replay_stop"
        echo ""
        echo "  WILN cfg:           $${WILN_PARAMS_FILE}"
        echo "  Supervisor cfg:     $${SUPERVISOR_PARAMS_FILE}"
        echo "  Route manager cfg:  $${ROUTE_MANAGER_PARAMS_FILE}"
        echo "  Front obstacle cfg: $${FRONT_OBSTACLE_PARAMS_FILE}"
        echo ""
        exec ros2 launch norlab_robot teach_repeat.launch.py \
          use_sim_time:=false \
          wiln_params_file:=$${WILN_PARAMS_FILE} \
          supervisor_params_file:=$${SUPERVISOR_PARAMS_FILE} \
          route_manager_params_file:=$${ROUTE_MANAGER_PARAMS_FILE} \
          front_obstacle_params_file:=$${FRONT_OBSTACLE_PARAMS_FILE} \
          follower_cmd_vel_topic:=$${WILN_FOLLOWER_CMD_TOPIC} \
          follower_external_command_mux:=$${WILN_EXTERNAL_COMMAND_MUX}

  # Optional obstacle-avoidance stack in observation-only mode. It is not part
  # of the default or wiln profiles and cannot publish to controller/cmd_vel.
  avoidance_shadow:
    <<: [*live_robot_base]
    profiles: ["avoidance"]
    depends_on:
      - mapping
    command:
      - ros2
      - launch
      - mtt_avoidance
      - avoidance_shadow.launch.py
      - enabled:=true
      - shadow_mode:=true
      - execution_enabled:=false
      - reverse_recovery_enabled:=false
      - command_output_topic:=/mtt_avoidance/selected_articulated_cmd
      - hardware_output_enabled:=false

  wiln_teach_start:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - ros2
      - service
      - call
      - /mtt_repeat/teach_start
      - std_srvs/srv/Trigger
      - "{}"

  wiln_teach_stop:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - ros2
      - service
      - call
      - /mtt_repeat/teach_stop
      - std_srvs/srv/Trigger
      - "{}"

  wiln_save:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - bash
      - -lc
      - |
        eval "$$($${WORKSPACE}/scripts/wiln_route_env.sh --mode save --create-dir --update-latest)"
        # 11C: Wait for /wiln/trajectory before saving — avoids race when wiln_save is
        # called immediately after wiln_teach_stop. The teach node publishes the trajectory
        # on stop; transient_local QoS ensures late subscribers receive it, but there is a
        # brief DDS propagation window. Timeout 5s covers normal startup delays.
        echo "Waiting for trajectory on /wiln/trajectory..."
        timeout 5 ros2 topic echo --once /wiln/trajectory > /dev/null 2>&1 || {
          echo "ERROR: No trajectory available after 5s. Did you run wiln_teach_stop first?"
          exit 1
        }
        echo "Saving route '$${ROUTE_NAME}' -> $${ROUTE_FILE}"
        ros2 topic pub --once /wiln/command std_msgs/msg/String "{data: 'save:$${ROUTE_FILE}'}"

  wiln_load:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - bash
      - -lc
      - |
        eval "$$($${WORKSPACE}/scripts/wiln_route_env.sh --mode load)"
        echo "Loading route '$${ROUTE_NAME}' -> $${ROUTE_FILE}"
        ros2 topic pub --once /wiln/command std_msgs/msg/String "{data: 'load:$${ROUTE_FILE}'}"
        ros2 service call /mtt_repeat/mark_ready std_srvs/srv/Trigger "{}"

  wiln_validate:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - bash
      - -lc
      - |
        eval "$$($${WORKSPACE}/scripts/wiln_route_env.sh --mode load)"
        python3 ${WORKSPACE}/scripts/validate_wiln_route.py "$${ROUTE_FILE}"

  wiln_replay:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - ros2
      - service
      - call
      - /mtt_repeat/play_line
      - std_srvs/srv/Trigger
      - "{}"

  wiln_replay_stop:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - ros2
      - service
      - call
      - /mtt_repeat/cancel
      - std_srvs/srv/Trigger
      - "{}"

  wiln_replay_loop:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - bash
      - -lc
      - |
        ros2 service call /mtt_repeat/play_loop std_srvs/srv/Trigger "{}"

  icp_check:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - python3
      - ${WORKSPACE}/scripts/check_icp_odom.py
      - --duration
      - ${ICP_CHECK_DURATION:-8}

  field_ready:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - python3
      - ${WORKSPACE}/scripts/field_ready_check.py
      - --icp-duration
      - ${ICP_CHECK_DURATION:-6}

  icp_health:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - python3
      - ${WORKSPACE}/scripts/audit_icp_health.py

  wiln_status:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - bash
      - -lc
      - |
        green='\033[0;32m'; red='\033[0;31m'; yellow='\033[1;33m'; bold='\033[1m'; reset='\033[0m'
        ok(){ echo -e "  $${green}✓$${reset} $$1"; }
        bad(){ echo -e "  $${red}✗$${reset} $$1"; }
        warn(){ echo -e "  $${yellow}⚠$${reset} $$1"; }
        has_topic(){ ros2 topic list 2>/dev/null | grep -qx "$$1"; }
        has_service(){ ros2 service list 2>/dev/null | grep -qx "$$1"; }
        echo -e "$${bold}== WILN / Repeat Status ==$${reset}"
        echo ""
        echo -e "$${bold}Stack$${reset}"
        has_topic /wiln/command && ok "/wiln/command ready" || bad "/wiln/command missing — wiln container probably crashed; run: docker compose logs --tail=200 wiln"
        for topic in /wiln/teach/state /wiln/route/state /wiln/replay/state /wiln/follower/state /wiln/trajectory /wiln/global_plan /wiln/control/local_plan; do
          has_topic "$$topic" && ok "$$topic" || warn "$$topic missing"
        done
        echo ""
        echo -e "$${bold}MTT repeat services$${reset}"
        for svc in /mtt_repeat/teach_start /mtt_repeat/teach_stop /mtt_repeat/play_line /mtt_repeat/play_loop /mtt_repeat/cancel /mtt_repeat/mark_ready; do
          has_service "$$svc" && ok "$$svc" || bad "$$svc missing"
        done
        echo ""
        echo -e "$${bold}Control mode / buttons$${reset}"
        printf "  selected_mode: "; timeout 2s ros2 topic echo --once /mtt_control/selected_mode --field data 2>/dev/null || echo "missing (mode manager not publishing)"
        printf "  auto_enabled:  "; timeout 2s ros2 topic echo --once /mtt_control/auto_mode_enabled --field data 2>/dev/null || echo "missing"
        printf "  selected_src:  "; timeout 2s ros2 topic echo --once /mtt_control/selected_source --field data 2>/dev/null || echo "missing"
        printf "  deadman:       "; timeout 2s ros2 topic echo --once /mtt_control/teleop_deadman --field data 2>/dev/null || echo "missing (normal if no joystick/deadman pressed)"
        echo "  buttons: A=auto, B=stop, Y=manual, RB=deadman"
        echo ""
        echo -e "$${bold}Repeat command flow$${reset}"
        for topic in /wiln/trajectory /wiln/control/local_plan /controller/cmd_vel /cmd_vel; do
          if has_topic "$$topic"; then
            ok "$$topic"
            timeout 2s ros2 topic hz "$$topic" 2>/dev/null | sed -n '1,2p' | sed 's/^/    /' || true
          else
            warn "$$topic missing"
          fi
        done
        echo ""
        echo -e "$${bold}Safety / odometry$${reset}"
        has_topic /mapping/icp_odom && ok "/mapping/icp_odom" || bad "/mapping/icp_odom missing"
        has_topic /mapping/map && ok "/mapping/map" || warn "/mapping/map missing"
        has_topic /mapping/trajectory_path && ok "/mapping/trajectory_path" || warn "/mapping/trajectory_path missing"
        has_topic /mapping/aligned_scan && ok "/mapping/aligned_scan" || warn "/mapping/aligned_scan missing"
        has_topic /mtt_health && ok "/mtt_health" || bad "/mtt_health missing"
        has_topic /hesai_lidar/points && ok "/hesai_lidar/points" || bad "/hesai_lidar/points missing — front obstacle stop cannot work"
        has_topic /mtt_obstacle/hazard_status && ok "/mtt_obstacle/hazard_status" || warn "/mtt_obstacle/hazard_status missing — WILN/front obstacle monitor not running"
        printf "  front obstacle: "; timeout 2s ros2 topic echo --once /mtt_obstacle/hazard_status --field data 2>/dev/null || echo "unavailable"
        printf "  front clearance:"; timeout 2s ros2 topic echo --once /mtt_obstacle/front_clearance_m --field data 2>/dev/null || echo " unavailable"
        printf "  front stop:     "; timeout 2s ros2 topic echo --once /mtt_obstacle/stop_requested --field data 2>/dev/null || echo "unavailable"
        printf "  slowdown scale: "; timeout 2s ros2 topic echo --once /mtt_obstacle/slowdown_scale --field data 2>/dev/null || echo "unavailable"
        echo "  quick ICP check: docker compose run --rm icp_check"
        printf "  health:        "; timeout 2s ros2 topic echo --once /mtt_health 2>/dev/null | sed -n '1,12p' || echo "unavailable"
        echo ""
        echo -e "$${bold}Repeat state$${reset}"
        timeout 2s ros2 topic echo --once /mtt_repeat/state 2>/dev/null || echo "  /mtt_repeat/state unavailable"
        timeout 2s ros2 topic echo --once /mtt_repeat/ready 2>/dev/null || echo "  /mtt_repeat/ready unavailable"
        echo ""
        echo -e "$${bold}Route manager$${reset}"
        timeout 4s ros2 service call /mtt_route/status mtt_interfaces/srv/RouteStatus "{}" 2>/dev/null || echo "  /mtt_route/status unavailable"
        timeout 2s ros2 topic echo --once /mtt_route/status_text 2>/dev/null || true
        echo ""
        echo -e "$${bold}Debug hint$${reset}"
        echo "  If mode is not auto, press A or use route_replay (it requests auto)."
        echo "  If selected_src is AUTO_WAIT, WILN is not publishing /controller/cmd_vel yet."
        echo "  If /wiln/control/local_plan is missing during replay, route is not loaded/playing."
        echo "  If ICP check fails, do not repeat; fix mapper/TF/cloud first."
        echo "  If /wiln/command is missing, inspect: docker compose logs --tail=200 wiln"

  route_list:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - ros2
      - service
      - call
      - /mtt_route/list
      - mtt_interfaces/srv/RouteList
      - "{}"

  route_validate:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - bash
      - -lc
      - |
        eval "$$($${WORKSPACE}/scripts/wiln_route_env.sh --mode load)"
        ros2 service call /mtt_route/validate mtt_interfaces/srv/RouteCommand "{route_name: \"$${ROUTE_NAME}\"}"

  route_preview:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - bash
      - -lc
      - |
        eval "$$($${WORKSPACE}/scripts/wiln_route_env.sh --mode load)"
        MPLCONFIGDIR=/tmp/matplotlib python3 ${WORKSPACE}/scripts/preview_wiln_route.py "$${ROUTE_FILE}" --output-dir "$${WILN_LTR_DIR}"
        PREVIEW_RC=$$?
        if [ "$${PREVIEW_RC}" -ne 0 ] && [ "$${PREVIEW_RC}" -ne 2 ]; then exit "$${PREVIEW_RC}"; fi
        ros2 service call /mtt_route/preview mtt_interfaces/srv/RouteCommand "{route_name: \"$${ROUTE_NAME}\"}"

  route_check:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - bash
      - -lc
      - |
        ${WORKSPACE}/scripts/route_field_check.sh

  route_load:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - bash
      - -lc
      - |
        eval "$$($${WORKSPACE}/scripts/wiln_route_env.sh --mode load)"
        ros2 service call /mtt_route/load mtt_interfaces/srv/RouteCommand "{route_name: \"$${ROUTE_NAME}\"}"

  route_replay:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - bash
      - -lc
      - |
        eval "$$($${WORKSPACE}/scripts/wiln_route_env.sh --mode load)"
        ros2 service call /mtt_route/replay mtt_interfaces/srv/RouteCommand "{route_name: \"$${ROUTE_NAME}\"}"

  route_stop:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - ros2
      - service
      - call
      - /mtt_route/stop
      - std_srvs/srv/Trigger
      - "{}"

  route_status:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - ros2
      - service
      - call
      - /mtt_route/status
      - mtt_interfaces/srv/RouteStatus
      - "{}"

  # ── Live diagnostic tools ──
  audit_topics:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - python3
      - ${WORKSPACE}/scripts/audit_live_topics.py
      - --duration
      - ${AUDIT_DURATION:-30}

  audit_tf:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - python3
      - ${WORKSPACE}/scripts/audit_tf_chain.py
      - --duration
      - ${AUDIT_DURATION:-60}

  route_start_check:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - bash
      - -lc
      - |
        eval "$$($${WORKSPACE}/scripts/wiln_route_env.sh --mode load)"
        python3 ${WORKSPACE}/scripts/route_start_check.py --route "$${ROUTE_FILE}"

  route_align:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - bash
      - -lc
      - |
        eval "$$($${WORKSPACE}/scripts/wiln_route_env.sh --mode load)"
        python3 ${WORKSPACE}/scripts/align_route_to_pose.py --route "$${ROUTE_FILE}"

  map_quality:
    <<: [*live_robot_base]
    profiles: ["wiln-ctrl"]
    command:
      - python3
      - ${WORKSPACE}/scripts/icp_map_quality_check.py
      - --duration
      - ${AUDIT_DURATION:-120}
