      MAPPING_SNAPSHOT_SAVE_INTERVAL_SCANS: ${MATHIS_MAPPING_SNAPSHOT_SAVE_INTERVAL_SCANS:-20}
      MAPPING_SNAPSHOT_MAX_TRANSLATION_CORRECTION_M: ${MATHIS_MAPPING_SNAPSHOT_MAX_TRANSLATION_CORRECTION_M:-1.0}
