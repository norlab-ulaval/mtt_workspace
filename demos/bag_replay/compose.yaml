x-build: &mtt_devel_build
  context: ../..
  dockerfile: docker/Dockerfile
  target: devel
  args:
    ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    USERNAME: mtt
    USER_UID: ${UID:-1000}
    USER_GID: ${GID:-1000}

x-replay-base: &replay_base
  extends:
    file: ../../docker/common.yaml
    service: ros_runtime_base
  env_file:
    - ../../.env
  image: ${MTT_IMAGE:-mtt_workspace:devel}
  build: *mtt_devel_build
  pull_policy: never
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
    REPLAY_RATE: ${REPLAY_RATE:-1.0}
    REPLAY_START_OFFSET: ${REPLAY_START_OFFSET:-0}
    REPLAY_KEEP_ZED_ODOM: ${REPLAY_KEEP_ZED_ODOM:-false}
    REPLAY_USE_RECORDED_MAPPING: ${REPLAY_USE_RECORDED_MAPPING:-false}
    # Sensor cage calibration version:
    #   v1 — cage BEFORE displacement (hesai rpy=π/2, X=LEFT frame). Use for all bags up to 2026-06-24.
    #   v2 — cage AFTER displacement  (hesai rpy=π,   X=BACKWARD frame). Use for bags from 2026-06-25+.
    # Each version carries its own sensor mount values (rsairy, ZED, IMU) in the matching frame.
    #   CALIBRATION=v2 BAG_PATH=/path/to/new_bag docker compose up
    CALIBRATION: ${CALIBRATION:-v1}
    # Path to the bag to replay — set in .env or on the command line:
    #   BAG_PATH=/path/to/bag dcr up
    BAG_PATH: ${BAG_PATH:-}

services:

  # ── Bag player with synthetic clock ──
  # --clock: republishes bag timestamps as /clock → all nodes use bag time
  # --loop: single-pass by default (REPLAY_LOOP=true to loop). Looping rewinds
  #   /clock on every wrap and re-latches the bag's /tf_static mid-run, which
  #   confuses TF2 buffers and the mapper's internal state — norlab_ws's
  #   working setup plays a single pass.
  # --rate: playback speed (1.0 = real-time, 0.5 = half speed for debug)
  bag_player:
    <<: [*replay_base]
    volumes:
      - ${WORKSPACE}/data:${WORKSPACE}/data
      - ${BAG_PATH:-${WORKSPACE}/data}:${BAG_PATH:-${WORKSPACE}/data}
    command:
      - bash
      - -lc
      - |
        if [ -z "$${BAG_PATH}" ]; then
          echo "ERROR: BAG_PATH is not set."
          echo "Usage: BAG_PATH=/path/to/session_or_bag docker compose up"
          exit 1
        fi
        PLAY_PATH="$${BAG_PATH}"
        if [ -f "$${PLAY_PATH}" ]; then
          PLAY_PATH="$$(dirname "$${PLAY_PATH}")"
        elif [ -d "$${PLAY_PATH}/bag" ] && [ -f "$${PLAY_PATH}/bag/metadata.yaml" ]; then
          PLAY_PATH="$${PLAY_PATH}/bag"
        fi
        if [ ! -f "$${PLAY_PATH}/metadata.yaml" ]; then
          echo "ERROR: resolved bag path '$${PLAY_PATH}' does not contain metadata.yaml"
          echo "You can pass:"
          echo "  - a session directory (contains bag/)"
          echo "  - a bag directory (contains metadata.yaml)"
          echo "  - a .mcap file inside the bag directory"
          exit 1
        fi
        echo "==================================================="
        echo " MTT Bag Replay"
        echo "   Input:  $${BAG_PATH}"
        echo "   Bag:    $${PLAY_PATH}"
        echo "   Rate:   ${REPLAY_RATE:-1.0}x"
        echo "==================================================="
        if [ -f "$$(dirname "$${PLAY_PATH}")/session_info.yaml" ]; then
          echo "Session info:"
          cat "$$(dirname "$${PLAY_PATH}")/session_info.yaml"
          echo "---"
        fi
        EXCLUDE_TOPICS=(
          /robot_description /joint_states /runtime_joint_states
          /merged_points /merged_points_raw /merged_points_filtered /hesai_in_base /rsairy_in_base
          /trailer/angle /trailer/pose
          /trailer/body_markers /trailer/trailer_roi_cloud
          /planned_trajectory /real_trajectory
          /wiln/pose /wiln/markers /wiln/obstacles
          /wiln/trajectory /wiln/global_plan /wiln/control/local_plan
          /wiln/debug/deformed_plan /wiln/debug/horizon /wiln/replay/diagnostics
          /mtt_route/active_path /mtt_route/closest_pose /mtt_route/error_marker
          /mtt_route/start_pose /mtt_route/status_text /mtt_route/safety_status
          /localization/articulation_angle /localization/articulation_pitch
          /trailer/odom /trailer/pose_in_map
          /zed/zed_node/pose
        )
        # ZED odom stays excluded unless used as the mapper odom prior
        # (zed_odom service + REPLAY_KEEP_ZED_ODOM=true).
        if [ "$${REPLAY_KEEP_ZED_ODOM:-false}" != "true" ]; then
          EXCLUDE_TOPICS+=( /zed/zed_node/odom )
        fi
        # Exclude the bag's recorded /tf (and /tf_static) by default: replaying it
        # alongside a live odom node (imu_odom/runtime_odometry) puts two publishers
        # on the same odom→base_footprint transform, which TF2 resolves by whichever
        # message arrives last — a race that only shows up once the robot moves.
        # norlab_ws's working mapper always excludes /tf. Set REPLAY_EXCLUDE_BAG_TF=false
        # only when no odom node is running and you want the bag's own TF as prior.
        if [ "$${REPLAY_EXCLUDE_BAG_TF:-true}" = "true" ]; then
          EXCLUDE_TOPICS+=( /tf /tf_static )
        fi
        if [ "$${REPLAY_USE_RECORDED_MAPPING:-false}" != "true" ]; then
          EXCLUDE_TOPICS+=(
            /mapping/icp_odom /mapping/map /mapping/pose_in
            /mapping/scan_after_deskew /mapping/scan_after_input_filters
            /mapping/trajectory_path /mapping/aligned_scan
          )
        else
          echo "Replay mode: keeping recorded /mapping/* topics from the bag."
          echo "Do not run this together with the 'mapping' profile."
        fi
        LOOP_FLAG=()
        if [ "$${REPLAY_LOOP:-false}" = "true" ]; then
          LOOP_FLAG=(--loop)
        fi
        exec ros2 bag play \
          --clock \
          --delay ${REPLAY_DELAY:-3} \
          "$${LOOP_FLAG[@]}" \
          --read-ahead-queue-size 10000 \
          --rate ${REPLAY_RATE:-1.0} \
          --start-offset ${REPLAY_START_OFFSET:-0} \
          --storage mcap \
          --exclude-topics "$${EXCLUDE_TOPICS[@]}" \
          --qos-profile-overrides-path ${WORKSPACE}/src/external/norlab_robot/config/rosbag_record/qos_replay_override.yaml \
          "$${PLAY_PATH}"

  # ── Robot description publisher (needed for TF from URDF) ──
  # CRITICAL: use_sim_time:=true required for bag replay.
  # Without it, robot_state_publisher publishes TF with wall-clock timestamps
  # while the bag player emits /clock at bag timestamps → TF2 lookups at bag
  # time fail ("TF_FUTURE_TRANSFORM") and the robot model is invisible in Foxglove.
  #
  # Note: the bag also contains /tf_static from the recording session.
  # robot_state_publisher publishes /tf_static from the current URDF (calibrated).
  # TF2 merges both; for the same (parent,child) pair the last-published wins —
  # the description service value (current calibration) overrides the bag value.
  description:
    <<: [*replay_base]
    depends_on:
      bag_player:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        echo "Waiting for /clock..."
        ros2 topic wait /clock --timeout 30 2>&1 || echo "/clock wait timeout, continuing anyway"
        echo "Starting robot_state_publisher..."
        exec ros2 launch ${WORKSPACE}/demos/bag_replay/launch/description_calib.launch.py

  # ── ZED detections → Foxglove markers ──
  # Converts zed_msgs/ObjectsStamped into visualization_msgs/MarkerArray so
  # Foxglove can show detected people/objects in the 3D panel.
  zed_markers:
    <<: [*replay_base]
    profiles: ["zed"]
    depends_on:
      bag_player:
        condition: service_started
    command:
      - python3
      - -u
      - ${WORKSPACE}/scripts/zed_objects_to_markers.py
      - --only-person

  # ── Runtime odometry rebuild for replay ──
  # Older bags do not always carry a usable articulated body state for the
  # current URDF. Re-run the current odometry node on top of the recorded
  # tachometer/cmd_vel stream, but keep its outputs on replay-local topics.
  runtime_odometry:
    <<: [*replay_base]
    profiles: ["wheel_odom"]
    depends_on:
      bag_player:
        condition: service_started
    command:
      - ros2
      - run
      - mtt_driver
      - mtt_odometry_node_exe
      - --ros-args
      - --params-file
      - ${WORKSPACE}/demos/common/config/mtt_driver.yaml
      - -p
      - use_sim_time:=true
      - -p
      - broadcast_tf:=true
      - -p
      - cmd_vel_topic:=cmd_vel
      - -p
      - hardware_articulation_topic:=${REPLAY_ODOM_ARTICULATION_TOPIC:-/mtt_articulation_angle}
      - -p
      - articulation_state_topic:=${REPLAY_ODOM_ARTICULATION_STATE_TOPIC:-/unused/articulation_state}
      - -p
      - articulation_state_output_topic:=mtt/articulation_state/runtime
      - -p
      - use_articulation_state_lidar:=false
      - -p
      - imu_yaw_rate_topic:=${REPLAY_ODOM_IMU_TOPIC:-/mti100/data}
      - -p
      - imu_yaw_rate_sign:=${REPLAY_ODOM_IMU_YAW_SIGN:--1.0}
      # Gyro bias is bag-dependent: bags recorded with the bias_compensator
      # active (/mti100/data already unbiased) need 0.0. Measure per bag with
      # scripts/analyze_imu_bias.py and override REPLAY_ODOM_IMU_BIAS if needed.
      - -p
      - imu_yaw_rate_bias_rad_s:=${REPLAY_ODOM_IMU_BIAS:-0.0}
      - -p
      - imu_yaw_rate_timeout_seconds:=0.2
      # CRITICAL: use_imu_heading=false prevents the yaw-jump bug where the
      # IMU's Madgwick absolute heading (from orientation quaternion) directly
      # overwrites the model heading (odometry_calculator.cpp:124).  In replay,
      # IMU data gaps > 0.2 s freeze the stale heading; when IMU resumes the
      # heading snaps by up to 47° in one 50 ms tick.  With false, the heading
      # is integrated smoothly from the IMU yaw rate (eff_ang).  The mapper's
      # ICP corrects the resulting slow drift.
      - -p
      - use_imu_heading:=false
      - -r
      - mtt_odometry:=mtt_odometry/runtime
      - -r
      - mtt_articulation_angle:=mtt_articulation_angle/runtime

  # ── IMU-based odometry for replay (rotation-only prior) ──
  # Alternative to runtime_odometry when wheel encoders produce bad Z values.
  # Subscribes to /mti100/data and publishes odom → base_footprint TF using
  # MTi-100 IMU orientation only (no acceleration integration, no Z drift).
  #
  # rotation_only=true : only heading/orientation from IMU, position constant
  # real_time=false    : unlimited TF buffer (1000000 s) and unlimited message
  #                      queue — required for bag replay with sim_time.
  #
  # Usage (replaces runtime_odometry for mapping):
  #   BAG_PATH=... MAPPING_CONFIG=.../_config_hesai_imu_replay.yaml \
  #     docker compose up bag_player description imu_odom mapping foxglove
  #
  # Profile-guarded: does NOT start with `--profile mapping` (profiles: [imu_odom]).
  #   Run explicitly: docker compose up imu_odom mapping
  # WARNING: do NOT start both imu_odom and runtime_odometry at the same time —
  #   both publish odom → base_footprint TF which creates a TF tree conflict.
  imu_odom:
    <<: [*replay_base]
    profiles: ["imu_odom"]
    depends_on:
      bag_player:
        condition: service_started
      description:
        condition: service_started
    command:
      - ros2
      - run
      - imu_odom
      - imu_odom_node
      - --ros-args
      - -p
      - use_sim_time:=true
      - -p
      - odom_frame:=${IMU_ODOM_FRAME:-odom}
      - -p
      - robot_frame:=${IMU_ODOM_ROBOT_FRAME:-base_footprint}
      - -p
      - imu_frame:=${IMU_ODOM_IMU_FRAME:-imu_link}
      - -p
      - rotation_only:=${IMU_ODOM_ROTATION_ONLY:-true}
      - -p
      - real_time:=false
      - -p
      - use_altitude:=${IMU_ODOM_USE_ALTITUDE:-false}
      - -r
      - imu_topic:=${IMU_ODOM_TOPIC:-/mti100/data}
      - -r
      - icp_odom:=${IMU_ODOM_ICP_TOPIC:-/mapping/icp_odom}

  # ── KISS-ICP prior odometry ──
  # Independent IMU prior for KISS. It intentionally does NOT subscribe to
  # /mapping/icp_odom, because that is KISS' own output in this profile.
  # Feeding KISS output back into imu_odom and then using imu_odom as the KISS
  # prior creates a positive feedback loop: KISS → imu_odom TF → KISS.
  imu_odom_kiss:
    <<: [*replay_base]
    profiles: ["kissicp"]
    depends_on:
      bag_player:
        condition: service_started
      description:
        condition: service_started
    command:
      - ros2
      - run
      - imu_odom
      - imu_odom_node
      - --ros-args
      - -p
      - use_sim_time:=true
      - -p
      - odom_frame:=${KISS_IMU_ODOM_FRAME:-odom}
      - -p
      - robot_frame:=${KISS_IMU_ODOM_ROBOT_FRAME:-base_footprint}
      - -p
      - imu_frame:=${KISS_IMU_ODOM_IMU_FRAME:-imu_link}
      - -p
      - rotation_only:=${KISS_IMU_ODOM_ROTATION_ONLY:-true}
      - -p
      - real_time:=false
      - -p
      - use_altitude:=${KISS_IMU_ODOM_USE_ALTITUDE:-false}
      - -r
      - imu_topic:=${KISS_IMU_ODOM_TOPIC:-/mti100/data}
      - -r
      - icp_odom:=${KISS_IMU_ODOM_ICP_TOPIC:-/kiss_icp/no_icp_feedback}

  # ── Mathis COM-shift replay odometry ──
  # Same odom principle as demos/mathis_com_shift:
  #   - imu_odom owns odom → base_footprint
  #   - no runtime_odometry at the same time
  #   - no altitude input unless this service is explicitly changed later
  #   - mapper feeds /mapping/icp_odom back into imu_odom
  imu_odom_mathis:
    <<: [*replay_base]
    profiles: ["mathis_mapping"]
    depends_on:
      bag_player:
        condition: service_started
      description:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        exec ros2 run imu_odom imu_odom_node --ros-args \
          -p use_sim_time:=true \
          -p odom_frame:="$${IMU_ODOM_FRAME:-odom}" \
          -p robot_frame:="$${IMU_ODOM_ROBOT_FRAME:-base_footprint}" \
          -p imu_frame:="$${IMU_ODOM_IMU_FRAME:-imu_link}" \
          -p rotation_only:="$${IMU_ODOM_ROTATION_ONLY:-false}" \
          -p real_time:=false \
          -p use_altitude:=false \
          -r imu_topic:="$${IMU_ODOM_TOPIC:-/mti100/data}" \
          -r imu_odom:="$${IMU_ODOM_OUTPUT_TOPIC:-/imu_odom}" \
          -r icp_odom:="$${IMU_ODOM_ICP_TOPIC:-/mapping/icp_odom}"

  # ── ZED visual odometry → odom TF (replay-only odom prior) ──
  # Wheel odom translation diverges on the downhill segment (track slip at
  # 2 m/s: >100% error between processed scans → ICP loses lock). The ZED VIO
  # recorded in the bag tracked that segment correctly, including the real
  # z descent. Requires REPLAY_KEEP_ZED_ODOM=true on bag_player.
  # Do NOT run together with runtime_odometry or imu_odom (same TF).
  zed_odom:
    <<: [*replay_base]
    profiles: ["zed_odom"]
    depends_on:
      bag_player:
        condition: service_started
      description:
        condition: service_started
    command:
      - python3
      - -u
      - ${WORKSPACE}/scripts/zed_odom_to_tf.py
      - --ros-args
      - -p
      - use_sim_time:=true
      - -p
      - odom_frame:=${ZED_ODOM_FRAME:-odom}
      - -p
      - robot_frame:=${ZED_ODOM_ROBOT_FRAME:-base_footprint}
      - -p
      - camera_frame:=${ZED_ODOM_CAMERA_FRAME:-zed_camera_link}

  # ── Joint-state reconstruction from replay-local articulation + tachometer ─
  # One shared builder owns the articulated visualization in replay and in
  # simulation. The bag keeps sensors and odometry, but not body TF/joint state.
  #
  # By default the visual mesh follows the HARDWARE/effective angle (via
  # articulation_state_topic, which prefers hardware_rad over effective_rad
  # whenever hardware is fresh — see mtt_joint_state_builder_node.cpp's
  # on_articulation_state()). To instead drive the visual trailer with the
  # LiDAR-DETECTED angle from trailer_detector_node — useful to visually verify
  # /trailer/articulation_angle against the real trailer's rotation — override:
  #   REPLAY_JOINT_ARTICULATION_TOPIC=/trailer/articulation_angle
  #   REPLAY_JOINT_ARTICULATION_STATE_TOPIC=
  # (empty string disables the higher-priority MttArticulationState path so it
  # falls through to the plain Float64 articulation_topic above).
  joint_state_builder:
    <<: [*replay_base]
    profiles: ["wheel_odom"]
    depends_on:
      runtime_odometry:
        condition: service_started
    command:
      - ros2
      - run
      - mtt_driver
      - mtt_joint_state_builder_node_exe
      - --ros-args
      - --params-file
      - ${WORKSPACE}/demos/common/config/mtt_driver.yaml
      - -p
      - use_sim_time:=true
      - -p
      - joint_state_topic:=joint_states
      - -p
      - articulation_topic:=${REPLAY_JOINT_ARTICULATION_TOPIC:-mtt_articulation_angle/runtime}
      - -p
      - articulation_state_topic:=${REPLAY_JOINT_ARTICULATION_STATE_TOPIC:-mtt/articulation_state/runtime}
      - -p
      - articulation_state_timeout_seconds:=1.0
      - -p
      - tachometer_topic:=mtt_tachometer

  # ── Factor Graph localization in replay mode ──
  # Fuses all recorded sensor topics.
  # use_sim_time:=true ensures the graph runs on bag timestamps.
  # track_odom_topic/articulation_topic MUST point at the /runtime-suffixed
  # streams (recomputed by runtime_odometry) instead of the launch file's live
  # defaults (raw bag-recorded topics) — same convention already used by the
  # mapping/joint_state_builder services. Depends on runtime_odometry so those
  # streams actually exist before factor_graph_node subscribes.
  # REPLAY_LOCALIZATION_USE_GPS_HEADING: set to false for single-antenna sessions
  # (check session_info.yaml's gps_antennas field) — a single-antenna bag's
  # /gps/heading is not a valid measurement, and feeding it in as a tight rotation
  # PriorFactor injects contradictory absolute-orientation constraints across
  # keyframes as the robot turns, observed to manifest as
  # IndeterminantLinearSystemException near the IMU bias.
  localization:
    <<: [*replay_base]
    profiles: ["localization"]
    depends_on:
      bag_player:
        condition: service_started
      runtime_odometry:
        condition: service_started
    command:
      - ros2
      - launch
      - mtt_localization
      - localization.launch.py
      - use_sim_time:=true
      - track_odom_topic:=mtt_odometry/runtime
      - articulation_topic:=mtt/articulation_state/runtime
      - use_gps:=${REPLAY_LOCALIZATION_USE_GPS:-true}
      - use_gps_heading:=${REPLAY_LOCALIZATION_USE_GPS_HEADING:-true}

  # ── Offline ICP rebuild for one session or a whole data directory ──
  # Replays the bag, rebuilds the merged cloud if both LiDARs are available,
  # runs the ICP mapper, and saves:
  #   <session>/offline_icp/map.vtk
  #   <session>/offline_icp/trajectory.vtk
  # plus top-level map.vtk/trajectory.vtk compatibility copies.
  #
  # Usage examples:
  #   BAG_PATH=${WORKSPACE}/data/mtt_nominal_outside_2026-04-30_16-08-13 \
  #     docker compose --profile offline_icp up offline_icp
  #
  #   docker compose --profile offline_icp up offline_icp
  #     → processes every mtt_* session under ${WORKSPACE}/data
  offline_icp:
    <<: [*replay_base]
    profiles: ["offline_icp"]
    volumes:
      - ${WORKSPACE}/data:${WORKSPACE}/data
      - ${BAGS_ROOT:-/data/mtt_bags}:${BAGS_ROOT:-/data/mtt_bags}
    environment:
      BAG_PATH: ${BAG_PATH:-}
      BAGS_ROOT: ${BAGS_ROOT:-/data/mtt_bags}
      DATA_DIR: ${DATA_DIR:-/data/mtt_bags}
      REPLAY_RATE: ${REPLAY_RATE:-1.0}
      OFFLINE_ICP_MODE: ${OFFLINE_ICP_MODE:-auto}
      OFFLINE_ICP_FORCE: ${OFFLINE_ICP_FORCE:-false}
      OFFLINE_ICP_QUALITY: ${OFFLINE_ICP_QUALITY:-standard}
      OFFLINE_ICP_SETTLE_S: ${OFFLINE_ICP_SETTLE_S:-4.0}
      OFFLINE_ICP_MAX_REPLAY_RATE: ${OFFLINE_ICP_MAX_REPLAY_RATE:-0.25}
      OFFLINE_ICP_READY_TIMEOUT_S: ${OFFLINE_ICP_READY_TIMEOUT_S:-30.0}
      OFFLINE_ICP_PLAY_TIMEOUT_MARGIN_S: ${OFFLINE_ICP_PLAY_TIMEOUT_MARGIN_S:-90.0}
      OFFLINE_ICP_MAPPING_CONFIG: ${OFFLINE_ICP_MAPPING_CONFIG:-}
      OFFLINE_ICP_FILTER_TRAILER: ${OFFLINE_ICP_FILTER_TRAILER:-true}
      OFFLINE_ICP_MAPPING_ODOM_FRAME: ${OFFLINE_ICP_MAPPING_ODOM_FRAME:-odom}
      OFFLINE_ICP_EXPERIMENT_NAME: ${OFFLINE_ICP_EXPERIMENT_NAME:-}
      OFFLINE_ICP_PLAYBACK_POLICY: ${OFFLINE_ICP_PLAYBACK_POLICY:-auto}
    command:
      - python3
      - -u
      - ${WORKSPACE}/demos/bag_replay/scripts/offline_icp.py

  # ── Perception in replay ──
  # Launches the full perception stack via perception.launch.py:
  #
  #   cloud_merger_node       — fuses Hesai + RS-Airy into /merged_points_filtered
  #                             (base_link frame, bbox-filtered, ~20 Hz)
  #   trailer_detector_node   — 2D PCA + 1D KF on raw RS-Airy cloud
  #                             → /trailer/articulation_angle (always launched)
  #   mtt_trailer_estimator_node — 10-DOF EKF in map frame, fuses:
  #                             - kinematic prior from /mtt_odometry + articulation angle
  #                             - /mapping/icp_odom when available (mapping profile)
  #                             - RS-Airy ICP on oriented ROI (10 Hz)
  #                             - Hesai ICP supplement (10 Hz, if enable_hesai=true)
  #                             → /trailer/pose, /trailer/odom, /trailer/pose_in_map,
  #                               /trailer/body_markers, /trailer/trailer_roi_cloud,
  #                               /trailer/articulation_angle (back-computed), TF map→trailer_body
  #
  # trailer_pose_node (V4.0, legacy) is the default and the proven/stable reference.
  # Set REPLAY_ENABLE_NEW_TRAILER_ESTIMATOR=true to A/B against mtt_trailer_estimator_node
  # (EKF V1.0) instead — that node is REGRESSED (two competing yaw models, dead ICP/RANSAC
  # code, markers decoupled from filter state); do not use it as the default measurement
  # source for anything downstream.
  #
  # Depends on description so robot_state_publisher has published TF before
  # cloud_merger_node tries to transform clouds (hesai_lidar → base_link).
  # Depends on runtime_odometry for /mtt_odometry kinematic prior.
  perception:
    <<: [*replay_base]
    profiles: ["perception", "mapping"]
    depends_on:
      bag_player:
        condition: service_started
      description:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        echo "Waiting for /clock and TF to settle..."
        sleep 3
        exec ros2 launch mtt_perception perception.launch.py \
          use_sim_time:=true \
          enable_new_trailer_estimator:=${REPLAY_ENABLE_NEW_TRAILER_ESTIMATOR:-false} \
          publish_filtered:=true \
          cloud_merger_max_pair_dt:=0.120 \
          cloud_merger_tf_timeout:=0.100 \
          cloud_merger_publish_debug_inputs:=true \
          cloud_merger_enable_trailer_bbox_filter:=${REPLAY_FILTER_TRAILER_FROM_MAPPING:-true}

  # ── Cloud merger only for KISS-ICP replay ──
  # Publishes /merged_points_filtered without starting runtime_odometry or the
  # trailer perception stack. This is safe to combine with the kissicp profile:
  # imu_odom_kiss remains the only odom -> base_footprint TF source.
  #
  # Usage:
  #   KISS_POINTS_TOPIC=/merged_points_filtered \
  #   docker compose --profile kissicp --profile kissicp_merged up \
  #     bag_player description imu_odom_kiss cloud_merger_kiss kiss_icp foxglove -d
  cloud_merger_kiss:
    <<: [*replay_base]
    profiles: ["kissicp_merged"]
    depends_on:
      bag_player:
        condition: service_started
      description:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        wait_for_topic() {
          topic="$$1"
          timeout_s="$$2"
          echo "Waiting for $$topic..."
          for i in $$(seq 1 "$$timeout_s"); do
            ros2 topic info "$$topic" 2>/dev/null | grep -qE "Publisher count: [1-9]" && return 0
            sleep 1
          done
          echo "ERROR: $$topic not available after $${timeout_s}s"
          return 1
        }
        wait_for_tf() {
          parent="$$1"
          child="$$2"
          timeout_s="$$3"
          echo "Waiting for TF $$parent -> $$child..."
          deadline=$$(( $$(date +%s) + timeout_s ))
          while [ "$$(date +%s)" -lt "$$deadline" ]; do
            if timeout 3 ros2 run tf2_ros tf2_echo "$$parent" "$$child" 2>&1 | grep -q "Translation"; then
              return 0
            fi
            sleep 1
          done
          return 1
        }

        wait_for_topic /hesai_lidar/points 75 || exit 1
        wait_for_topic /rsairy_ns/points 75 || {
          echo "ERROR: /rsairy_ns/points absent; merged cloud needs the RS-Airy bag topic."
          exit 1
        }
        wait_for_tf base_link hesai_lidar 45 || exit 2
        wait_for_tf base_link rsairy 45 || exit 2

        exec ros2 run mtt_perception cloud_merger_node --ros-args \
          --params-file ${WORKSPACE}/src/mtt_core/mtt_perception/config/perception.yaml \
          -p use_sim_time:=true \
          -p publish_filtered:=true \
          -p anchor_sensor:=${KISS_MERGER_ANCHOR_SENSOR:-hesai} \
          -p max_pair_dt:=${KISS_MERGER_MAX_PAIR_DT:-0.120} \
          -p tf_timeout:=${KISS_MERGER_TF_TIMEOUT:-0.100} \
          -p publish_debug_inputs:=${KISS_MERGER_PUBLISH_DEBUG_INPUTS:-true} \
          -p publish_reliable_raw_for_mapping:=${KISS_MERGER_PUBLISH_RELIABLE_RAW:-false} \
          -p remove_invalid_points:=${KISS_MERGER_REMOVE_INVALID_POINTS:-false} \
          -p hesai_stride:=${KISS_MERGER_HESAI_STRIDE:-1} \
          -p rsairy_stride:=${KISS_MERGER_RSAIRY_STRIDE:-1} \
          -p rsairy_inject_every_n:=${KISS_MERGER_RSAIRY_INJECT_EVERY_N:-1} \
          -p enable_self_bbox_filter:=${KISS_MERGER_ENABLE_SELF_BBOX_FILTER:-true} \
          -p enable_trailer_bbox_filter:=$${KISS_MERGER_ENABLE_TRAILER_BBOX_FILTER:-$${REPLAY_FILTER_TRAILER_FROM_MAPPING:-false}} \
          -p bbox_trailer_x:="$${KISS_MERGER_TRAILER_BBOX_X:-[-4.80,-0.65]}" \
          -p bbox_trailer_y:="$${KISS_MERGER_TRAILER_BBOX_Y:-[-2.20,2.20]}" \
          -p bbox_trailer_z:="$${KISS_MERGER_TRAILER_BBOX_Z:-[-0.45,2.70]}"

  # ── ICP mapping in replay ──
  # Baseline: single LiDAR /hesai_lidar/points — pas de cloud fusionné.
  # Le cloud fusionné (/merged_points_filtered) cumule deux problemes :
  #   1. ObservationDirectionDataPointsFilter sur nuage multi-origine = directions fausses.
  #   2. Dependance sur perception (cloud_merger_node) qui peut demarrer apres.
  # Pour activer le dual LiDAR dense: MAPPING_POINTS_TOPIC=/merged_points_filtered
  #   et MAPPING_CONFIG=.../config/mapping/_config_replay_dense.yaml
  mapping:
    <<: [*replay_base]
    profiles: ["mapping", "teach_repeat", "wiln_obstacles"]
    depends_on:
      bag_player:
        condition: service_started
      description:
        condition: service_started
      # runtime_odometry removed: mapper works with either runtime_odometry or
      # imu_odom as the odom TF source. Start the right one explicitly:
      #   wheel odom : docker compose up ... runtime_odometry mapping
      #   IMU odom   : docker compose up ... imu_odom mapping (+ MAPPING_CONFIG=..._hesai_imu_replay.yaml)
    volumes:
      - ${WORKSPACE}/scripts:${WORKSPACE}/scripts
    environment:
      MAPPING_POINTS_TOPIC: ${MAPPING_POINTS_TOPIC:-/hesai_lidar/points}
      MAPPING_RAW_POINTS_TOPIC: ${MAPPING_RAW_POINTS_TOPIC:-/hesai_lidar/points}
      MAPPING_CONFIG: ${MAPPING_CONFIG:-${WORKSPACE}/src/external/norlab_robot/config/mapping/_config_hesai_imu_replay.yaml}
      MAPPING_COMPRESSION_VOXEL_SIZE: ${MAPPING_COMPRESSION_VOXEL_SIZE:-0.50}
      MAPPING_MAP_PUBLICATION_SOURCE: ${MAPPING_MAP_PUBLICATION_SOURCE:-local}
      MAPPING_MAP_PUBLISH_RATE: ${MAPPING_MAP_PUBLISH_RATE:-1.0}
      MAPPING_MAP_TF_PUBLISH_RATE: ${MAPPING_MAP_TF_PUBLISH_RATE:-50.0}
      MAPPING_MIN_INPUT_POINTS: ${MAPPING_MIN_INPUT_POINTS:-200}
      # ── Relaxed gates matching mapper_hesai_universal approach ──
      # Accept everything, never reject. ICP with bag TF + IMU prior is reliable.
      MAPPING_MAX_TRANSLATION_CORRECTION: ${MAPPING_MAX_TRANSLATION_CORRECTION:-10.0}
      MAPPING_MAX_ROTATION_CORRECTION_DEG: ${MAPPING_MAX_ROTATION_CORRECTION_DEG:-180.0}
      MAPPING_MAX_VELOCITY_MS: ${MAPPING_MAX_VELOCITY_MS:-30.0}
      MAPPING_MAX_YAW_RATE_DEG_S: ${MAPPING_MAX_YAW_RATE_DEG_S:-360.0}
      MAPPING_MAX_POSE_YAW_STEP_DEG: ${MAPPING_MAX_POSE_YAW_STEP_DEG:-180.0}
      MAPPING_MAX_POSE_YAW_ODOM_RESIDUAL_DEG: ${MAPPING_MAX_POSE_YAW_ODOM_RESIDUAL_DEG:-90.0}
      MAPPING_MAX_POSE_STEP_M: ${MAPPING_MAX_POSE_STEP_M:-50.0}
      MAPPING_MAX_Z_JUMP_M: ${MAPPING_MAX_Z_JUMP_M:-10.0}
      MAPPING_MAX_REGISTRATION_TIME_MS: ${MAPPING_MAX_REGISTRATION_TIME_MS:-10000.0}
      MAPPING_MAX_IDLE_TIME: ${MAPPING_MAX_IDLE_TIME:-300.0}
      MAPPING_DETERMINISTIC_MAP_UPDATE_DISTANCE_M: ${MAPPING_DETERMINISTIC_MAP_UPDATE_DISTANCE_M:-0.20}
      MAPPING_DETERMINISTIC_MAP_UPDATE_YAW_DEG: ${MAPPING_DETERMINISTIC_MAP_UPDATE_YAW_DEG:-2.0}
      MAPPING_DETERMINISTIC_MAP_MIN_DIST_NEW_POINT: ${MAPPING_DETERMINISTIC_MAP_MIN_DIST_NEW_POINT:-0.20}
      MAPPING_DESKEW: ${MAPPING_DESKEW:-false}
      MAPPING_DESKEW_SOURCE: ${MAPPING_DESKEW_SOURCE:-tf}
      MAPPING_DESKEW_IMU_TOPIC: ${MAPPING_DESKEW_IMU_TOPIC:-/mti100/data}
      # ── Simplified map management: single map, no trimming ──
      MAPPING_ENABLE_GLOBAL_OUTPUT_MAP: ${MAPPING_ENABLE_GLOBAL_OUTPUT_MAP:-false}
      MAPPING_GLOBAL_OUTPUT_MAP_MIN_DIST_NEW_POINT: ${MAPPING_GLOBAL_OUTPUT_MAP_MIN_DIST_NEW_POINT:-0.20}
      MAPPING_ENABLE_MAP_TRIMMING: ${MAPPING_ENABLE_MAP_TRIMMING:-false}
      MAPPING_MAP_TRIM_RADIUS_M: ${MAPPING_MAP_TRIM_RADIUS_M:-200.0}
      MAPPING_MAX_MAP_POINTS_BEFORE_TRIM: ${MAPPING_MAX_MAP_POINTS_BEFORE_TRIM:-500000}
      # ── Minimal overlap checks (accept everything) ──
      MAPPING_MIN_POSE_OVERLAP_NEAR_RATIO: ${MAPPING_MIN_POSE_OVERLAP_NEAR_RATIO:-0.0}
      MAPPING_MIN_POSE_OVERLAP_LOOSE_RATIO: ${MAPPING_MIN_POSE_OVERLAP_LOOSE_RATIO:-0.0}
      MAPPING_MIN_MAP_OVERLAP_NEAR_RATIO: ${MAPPING_MIN_MAP_OVERLAP_NEAR_RATIO:-0.0}
      MAPPING_MIN_MAP_OVERLAP_LOOSE_RATIO: ${MAPPING_MIN_MAP_OVERLAP_LOOSE_RATIO:-0.0}
      # ── Correction limits also relaxed ──
      MAPPING_MAX_MAP_UPDATE_TRANSLATION_CORRECTION_M: ${MAPPING_MAX_MAP_UPDATE_TRANSLATION_CORRECTION_M:-50.0}
      MAPPING_MAX_MAP_UPDATE_ROTATION_CORRECTION_DEG: ${MAPPING_MAX_MAP_UPDATE_ROTATION_CORRECTION_DEG:-180.0}
      # ── Recovery disabled (map never rejects, never needs recovery) ──
      MAPPING_ENABLE_MAP_RECOVERY: ${MAPPING_ENABLE_MAP_RECOVERY:-false}
      MAPPING_RECOVERY_RELOAD_AFTER_REJECTIONS: ${MAPPING_RECOVERY_RELOAD_AFTER_REJECTIONS:-999}
      MAPPING_RECOVERY_ATTEMPT_INTERVAL_SCANS: ${MAPPING_RECOVERY_ATTEMPT_INTERVAL_SCANS:-999}
      MAPPING_RECOVERY_LOCAL_MAP_RADIUS_M: ${MAPPING_RECOVERY_LOCAL_MAP_RADIUS_M:-200.0}
      MAPPING_RECOVERY_LOCAL_MAP_MIN_POINTS: ${MAPPING_RECOVERY_LOCAL_MAP_MIN_POINTS:-100}
      MAPPING_RECOVERY_LOCAL_MAP_MAX_POINTS: ${MAPPING_RECOVERY_LOCAL_MAP_MAX_POINTS:-500000}
      MAPPING_SNAPSHOT_SAVE_INTERVAL_SCANS: ${MAPPING_SNAPSHOT_SAVE_INTERVAL_SCANS:-9999}
      MAPPING_SNAPSHOT_MAX_TRANSLATION_CORRECTION_M: ${MAPPING_SNAPSHOT_MAX_TRANSLATION_CORRECTION_M:-50.0}
      MAPPING_SNAPSHOT_MAX_ROTATION_CORRECTION_DEG: ${MAPPING_SNAPSHOT_MAX_ROTATION_CORRECTION_DEG:-180.0}
      # ── Adaptive gate disabled ──
      MAPPING_ENABLE_MOTION_ADAPTIVE_GATE: ${MAPPING_ENABLE_MOTION_ADAPTIVE_GATE:-false}
      MAPPING_ADAPTIVE_MAX_DT_S: ${MAPPING_ADAPTIVE_MAX_DT_S:-10.0}
      MAPPING_ADAPTIVE_VELOCITY_GAIN: ${MAPPING_ADAPTIVE_VELOCITY_GAIN:-10.0}
      MAPPING_ADAPTIVE_ACCELERATION_GAIN: ${MAPPING_ADAPTIVE_ACCELERATION_GAIN:-10.0}
      MAPPING_ADAPTIVE_YAW_RATE_GAIN: ${MAPPING_ADAPTIVE_YAW_RATE_GAIN:-10.0}
      MAPPING_AGGRESSIVE_SPEED_MS: ${MAPPING_AGGRESSIVE_SPEED_MS:-30.0}
      MAPPING_AGGRESSIVE_YAW_RATE_DEG_S: ${MAPPING_AGGRESSIVE_YAW_RATE_DEG_S:-360.0}
      MAPPING_PIVOT_LINEAR_SPEED_MS: ${MAPPING_PIVOT_LINEAR_SPEED_MS:-10.0}
      MAPPING_PIVOT_YAW_RATE_DEG_S: ${MAPPING_PIVOT_YAW_RATE_DEG_S:-360.0}
      MAPPING_PIVOT_MAX_TRANSLATION_CORRECTION_M: ${MAPPING_PIVOT_MAX_TRANSLATION_CORRECTION_M:-50.0}
      MAPPING_ENABLE_ODOM_BRIDGE: ${MAPPING_ENABLE_ODOM_BRIDGE:-false}
      MAPPING_ODOM_BRIDGE_AFTER_REJECTIONS: ${MAPPING_ODOM_BRIDGE_AFTER_REJECTIONS:-999}
      MAPPING_ODOM_BRIDGE_MIN_SPEED_MS: ${MAPPING_ODOM_BRIDGE_MIN_SPEED_MS:-30.0}
      MAPPING_ENABLE_PLANAR_POSE_CONSTRAINT: ${MAPPING_ENABLE_PLANAR_POSE_CONSTRAINT:-true}
      MAPPING_PLANAR_POSE_MAX_Z_DRIFT_M: ${MAPPING_PLANAR_POSE_MAX_Z_DRIFT_M:-5.0}
      MAPPING_INPUT_QOS_RELIABLE: ${MAPPING_INPUT_QOS_RELIABLE:-true}
      MAPPING_ANCHOR_MAP_AT_INITIAL_ROBOT_POSE: ${MAPPING_ANCHOR_MAP_AT_INITIAL_ROBOT_POSE:-true}
      MAPPING_MAP_PUBLISH_RADIUS_M: ${MAPPING_MAP_PUBLISH_RADIUS_M:-0.0}
      MAPPING_ENABLE_DYNAMIC_TRAILER_SELF_FILTER: ${MAPPING_ENABLE_DYNAMIC_TRAILER_SELF_FILTER:-false}
      MAPPING_DYNAMIC_TRAILER_ARTICULATION_TOPIC: ${MAPPING_DYNAMIC_TRAILER_ARTICULATION_TOPIC:-/mtt_articulation_angle}
      MAPPING_DYNAMIC_TRAILER_STALE_TIMEOUT_S: ${MAPPING_DYNAMIC_TRAILER_STALE_TIMEOUT_S:-0.5}
      MAPPING_DYNAMIC_TRAILER_YAW_OFFSET_RAD: ${MAPPING_DYNAMIC_TRAILER_YAW_OFFSET_RAD:-3.141592653589793}
      MAPPING_DYNAMIC_TRAILER_YAW_SIGN: ${MAPPING_DYNAMIC_TRAILER_YAW_SIGN:--1.0}
      MAPPING_DYNAMIC_TRAILER_HITCH_X: ${MAPPING_DYNAMIC_TRAILER_HITCH_X:--1.45}
      MAPPING_DYNAMIC_TRAILER_HITCH_Y: ${MAPPING_DYNAMIC_TRAILER_HITCH_Y:--0.085}
      MAPPING_DYNAMIC_TRAILER_FRONT_OFFSET_M: ${MAPPING_DYNAMIC_TRAILER_FRONT_OFFSET_M:--0.15}
      MAPPING_DYNAMIC_TRAILER_REAR_OFFSET_M: ${MAPPING_DYNAMIC_TRAILER_REAR_OFFSET_M:-2.20}
      MAPPING_DYNAMIC_TRAILER_HALF_WIDTH_M: ${MAPPING_DYNAMIC_TRAILER_HALF_WIDTH_M:-1.20}
      MAPPING_DYNAMIC_TRAILER_Z_MIN_M: ${MAPPING_DYNAMIC_TRAILER_Z_MIN_M:--0.35}
      MAPPING_DYNAMIC_TRAILER_Z_MAX_M: ${MAPPING_DYNAMIC_TRAILER_Z_MAX_M:-2.50}
      MAPPING_MAP_TRIM_INTERVAL_SCANS: ${MAPPING_MAP_TRIM_INTERVAL_SCANS:-2}
      MAPPING_ODOM_FRAME: ${MAPPING_ODOM_FRAME:-odom}
      MAPPING_ROBOT_FRAME: ${MAPPING_ROBOT_FRAME:-base_footprint}
      MAPPING_TF_CONFLICT_CHECK: ${MAPPING_TF_CONFLICT_CHECK:-true}
      MAPPING_TF_CONFLICT_CHECK_SECONDS: ${MAPPING_TF_CONFLICT_CHECK_SECONDS:-8}
      MAPPING_TF_CONFLICT_YAW_ALERT_DEG: ${MAPPING_TF_CONFLICT_YAW_ALERT_DEG:-25}
    command: &mapping_command
      - bash
      - -lc
      - |
        wait_for_cloud_topic() {
          topic="$$1"
          timeout_s="$$2"
          echo "Waiting for $$topic before starting mapper..."
          deadline=$$(( $$(date +%s) + timeout_s ))
          while [ "$$(date +%s)" -lt "$$deadline" ]; do
            if timeout 3 ros2 topic list 2>/dev/null | grep -qx "$$topic"; then
              return 0
            fi
            if timeout 4 ros2 topic hz "$$topic" --window 2 2>/dev/null | grep -q "average rate"; then
              echo "$$topic is publishing, even though ros2 topic list did not report it yet."
              return 0
            fi
            sleep 1
          done
          return 1
        }
        wait_for_cloud_topic "$${MAPPING_POINTS_TOPIC}" 75 || {
          echo "ERROR: $${MAPPING_POINTS_TOPIC} not available"
          exit 1
        }
        case "$${MAPPING_CONFIG}" in
          /*) ;;
          *) MAPPING_CONFIG="$${WORKSPACE}/$${MAPPING_CONFIG}" ;;
        esac
        echo "Using mapping config $${MAPPING_CONFIG}"
        echo "Using raw points topic $${MAPPING_POINTS_TOPIC}; mapper owns sensor→robot TF lookup."
        echo "Waiting for odom TF ($${MAPPING_ODOM_FRAME} → $${MAPPING_ROBOT_FRAME})..."
        timeout 45 bash -lc 'until ros2 run tf2_ros tf2_echo "$${MAPPING_ODOM_FRAME}" "$${MAPPING_ROBOT_FRAME}" 2>&1 | grep -q "Translation"; do sleep 1; done' || {
          echo "WARN: $${MAPPING_ODOM_FRAME} → $${MAPPING_ROBOT_FRAME} TF not visible after 45s."
          echo "  If no odom source is running, the mapper will start with identity prior (no motion)."
          echo "  For IMU-only prior (bags without tachometer), run:"
          echo "    MAPPING_CONFIG=.../_config_hesai_imu_replay.yaml docker compose up imu_odom mapping"
        }
        if [ "$${MAPPING_TF_CONFLICT_CHECK:-true}" = "true" ]; then
          echo "Checking $${MAPPING_ODOM_FRAME} → $${MAPPING_ROBOT_FRAME} for TF yaw jumps before starting mapper..."
          python3 "$${WORKSPACE}/scripts/detect_tf_conflict.py" \
            --parent "$${MAPPING_ODOM_FRAME}" \
            --child "$${MAPPING_ROBOT_FRAME}" \
            --yaw-alert "$${MAPPING_TF_CONFLICT_YAW_ALERT_DEG}" \
            --duration "$${MAPPING_TF_CONFLICT_CHECK_SECONDS}" || {
              echo "ERROR: TF conflict/yaw jump detected on $${MAPPING_ODOM_FRAME} → $${MAPPING_ROBOT_FRAME}."
          echo "Start exactly one odom TF source:"
          echo "  runtime_odometry  — wheel encoder odometry (bags WITH real/synthetic tachometer)"
          echo "  imu_odom          — IMU rotation-only prior (bags WITHOUT tachometer)"
          echo "  zed_odom          — ZED visual odometry (bags WITH ZED + REPLAY_KEEP_ZED_ODOM=true)"
          echo "Override only for debugging with MAPPING_TF_CONFLICT_CHECK=false."
              exit 2
            }
        fi
        sleep 2
        exec ros2 launch norlab_robot mapping.launch.py \
          use_sim_time:=true \
          mapping_points_topic:=$${MAPPING_POINTS_TOPIC} \
          mapping_config:=$${MAPPING_CONFIG} \
          mapping_deskew:=$${MAPPING_DESKEW} \
          mapping_deskew_source:=$${MAPPING_DESKEW_SOURCE} \
          mapping_deskew_imu_topic:=$${MAPPING_DESKEW_IMU_TOPIC} \
          mapping_compression_voxel_size:=$${MAPPING_COMPRESSION_VOXEL_SIZE} \
          mapping_map_publication_source:=$${MAPPING_MAP_PUBLICATION_SOURCE} \
          mapping_map_publish_rate:=$${MAPPING_MAP_PUBLISH_RATE} \
          mapping_map_tf_publish_rate:=$${MAPPING_MAP_TF_PUBLISH_RATE} \
          mapping_min_input_points:=$${MAPPING_MIN_INPUT_POINTS} \
          mapping_max_translation_correction:=$${MAPPING_MAX_TRANSLATION_CORRECTION} \
          mapping_max_rotation_correction_deg:=$${MAPPING_MAX_ROTATION_CORRECTION_DEG} \
          mapping_max_velocity_ms:=$${MAPPING_MAX_VELOCITY_MS} \
          mapping_max_yaw_rate_deg_s:=$${MAPPING_MAX_YAW_RATE_DEG_S} \
          mapping_max_pose_yaw_step_deg:=$${MAPPING_MAX_POSE_YAW_STEP_DEG} \
          mapping_max_pose_yaw_odom_residual_deg:=$${MAPPING_MAX_POSE_YAW_ODOM_RESIDUAL_DEG} \
          mapping_max_pose_step_m:=$${MAPPING_MAX_POSE_STEP_M} \
          mapping_max_z_jump_m:=$${MAPPING_MAX_Z_JUMP_M} \
          mapping_max_registration_time_ms:=$${MAPPING_MAX_REGISTRATION_TIME_MS} \
          mapping_max_idle_time:=$${MAPPING_MAX_IDLE_TIME} \
          deterministic_map_update_distance_m:=$${MAPPING_DETERMINISTIC_MAP_UPDATE_DISTANCE_M} \
          deterministic_map_update_yaw_deg:=$${MAPPING_DETERMINISTIC_MAP_UPDATE_YAW_DEG} \
          deterministic_map_min_dist_new_point:=$${MAPPING_DETERMINISTIC_MAP_MIN_DIST_NEW_POINT} \
          mapping_enable_global_output_map:=$${MAPPING_ENABLE_GLOBAL_OUTPUT_MAP} \
          mapping_global_output_map_min_dist_new_point:=$${MAPPING_GLOBAL_OUTPUT_MAP_MIN_DIST_NEW_POINT} \
          mapping_enable_map_trimming:=$${MAPPING_ENABLE_MAP_TRIMMING} \
          mapping_map_trim_radius_m:=$${MAPPING_MAP_TRIM_RADIUS_M} \
          mapping_max_map_points_before_trim:=$${MAPPING_MAX_MAP_POINTS_BEFORE_TRIM} \
          mapping_map_trim_interval_scans:=$${MAPPING_MAP_TRIM_INTERVAL_SCANS} \
          mapping_min_pose_overlap_near_ratio:=$${MAPPING_MIN_POSE_OVERLAP_NEAR_RATIO} \
          mapping_min_pose_overlap_loose_ratio:=$${MAPPING_MIN_POSE_OVERLAP_LOOSE_RATIO} \
          mapping_min_map_overlap_near_ratio:=$${MAPPING_MIN_MAP_OVERLAP_NEAR_RATIO} \
          mapping_min_map_overlap_loose_ratio:=$${MAPPING_MIN_MAP_OVERLAP_LOOSE_RATIO} \
          mapping_max_map_update_translation_correction_m:=$${MAPPING_MAX_MAP_UPDATE_TRANSLATION_CORRECTION_M} \
          mapping_max_map_update_rotation_correction_deg:=$${MAPPING_MAX_MAP_UPDATE_ROTATION_CORRECTION_DEG} \
          mapping_enable_map_recovery:=$${MAPPING_ENABLE_MAP_RECOVERY} \
          mapping_recovery_reload_after_rejections:=$${MAPPING_RECOVERY_RELOAD_AFTER_REJECTIONS} \
          mapping_recovery_attempt_interval_scans:=$${MAPPING_RECOVERY_ATTEMPT_INTERVAL_SCANS} \
          mapping_recovery_local_map_radius_m:=$${MAPPING_RECOVERY_LOCAL_MAP_RADIUS_M} \
          mapping_recovery_local_map_min_points:=$${MAPPING_RECOVERY_LOCAL_MAP_MIN_POINTS} \
          mapping_recovery_local_map_max_points:=$${MAPPING_RECOVERY_LOCAL_MAP_MAX_POINTS} \
          mapping_snapshot_save_interval_scans:=$${MAPPING_SNAPSHOT_SAVE_INTERVAL_SCANS} \
          mapping_snapshot_max_translation_correction_m:=$${MAPPING_SNAPSHOT_MAX_TRANSLATION_CORRECTION_M} \
          mapping_snapshot_max_rotation_correction_deg:=$${MAPPING_SNAPSHOT_MAX_ROTATION_CORRECTION_DEG} \
          mapping_enable_motion_adaptive_gate:=$${MAPPING_ENABLE_MOTION_ADAPTIVE_GATE} \
          mapping_adaptive_max_dt_s:=$${MAPPING_ADAPTIVE_MAX_DT_S} \
          mapping_adaptive_velocity_gain:=$${MAPPING_ADAPTIVE_VELOCITY_GAIN} \
          mapping_adaptive_acceleration_gain:=$${MAPPING_ADAPTIVE_ACCELERATION_GAIN} \
          mapping_adaptive_yaw_rate_gain:=$${MAPPING_ADAPTIVE_YAW_RATE_GAIN} \
          mapping_aggressive_speed_ms:=$${MAPPING_AGGRESSIVE_SPEED_MS} \
          mapping_aggressive_yaw_rate_deg_s:=$${MAPPING_AGGRESSIVE_YAW_RATE_DEG_S} \
          mapping_pivot_linear_speed_ms:=$${MAPPING_PIVOT_LINEAR_SPEED_MS} \
          mapping_pivot_yaw_rate_deg_s:=$${MAPPING_PIVOT_YAW_RATE_DEG_S} \
          mapping_pivot_max_translation_correction_m:=$${MAPPING_PIVOT_MAX_TRANSLATION_CORRECTION_M} \
          mapping_enable_odom_bridge:=$${MAPPING_ENABLE_ODOM_BRIDGE} \
          mapping_odom_bridge_after_rejections:=$${MAPPING_ODOM_BRIDGE_AFTER_REJECTIONS} \
          mapping_odom_bridge_min_speed_ms:=$${MAPPING_ODOM_BRIDGE_MIN_SPEED_MS:-1.5} \
          mapping_enable_planar_pose_constraint:=$${MAPPING_ENABLE_PLANAR_POSE_CONSTRAINT} \
          mapping_planar_pose_max_z_drift_m:=$${MAPPING_PLANAR_POSE_MAX_Z_DRIFT_M} \
          mapping_input_qos_reliable:=$${MAPPING_INPUT_QOS_RELIABLE} \
          mapping_anchor_map_at_initial_robot_pose:=$${MAPPING_ANCHOR_MAP_AT_INITIAL_ROBOT_POSE} \
          mapping_map_publish_radius_m:=$${MAPPING_MAP_PUBLISH_RADIUS_M} \
          mapping_enable_dynamic_trailer_self_filter:=$${MAPPING_ENABLE_DYNAMIC_TRAILER_SELF_FILTER} \
          mapping_dynamic_trailer_articulation_topic:=$${MAPPING_DYNAMIC_TRAILER_ARTICULATION_TOPIC} \
          mapping_dynamic_trailer_stale_timeout_s:=$${MAPPING_DYNAMIC_TRAILER_STALE_TIMEOUT_S} \
          mapping_dynamic_trailer_yaw_offset_rad:=$${MAPPING_DYNAMIC_TRAILER_YAW_OFFSET_RAD} \
          mapping_dynamic_trailer_yaw_sign:=$${MAPPING_DYNAMIC_TRAILER_YAW_SIGN} \
          mapping_dynamic_trailer_hitch_x:=$${MAPPING_DYNAMIC_TRAILER_HITCH_X} \
          mapping_dynamic_trailer_hitch_y:=$${MAPPING_DYNAMIC_TRAILER_HITCH_Y} \
          mapping_dynamic_trailer_front_offset_m:=$${MAPPING_DYNAMIC_TRAILER_FRONT_OFFSET_M} \
