      MAPPING_TF_CONFLICT_CHECK_SECONDS: ${MATHIS_MAPPING_TF_CONFLICT_CHECK_SECONDS:-8}
      MAPPING_TF_CONFLICT_YAW_ALERT_DEG: ${MATHIS_MAPPING_TF_CONFLICT_YAW_ALERT_DEG:-25}
    command: *mapping_command

  # ── KISS-ICP lightweight LiDAR odometry ──
  # Alternative to the norlab_icp_mapper_ros mapper above. Uses a different ICP
  # pipeline (KISS-ICP) with an independent IMU/TF prior. KISS still performs
  # LiDAR registration; the external prior seeds its motion prediction and scan
  # deskew through KISS-ICP's last_delta_.
  #
  # Default input is /hesai_lidar/points. To test a pre-filtered merged cloud,
  # start/publish that cloud separately and set:
  #   KISS_POINTS_TOPIC=/merged_points_filtered
  #
  # Usage:
  #   BAG_PATH=... docker compose --profile kissicp up bag_player description kiss_icp foxglove
  kiss_icp:
    <<: [*replay_base]
    profiles: ["kissicp"]
    depends_on:
      bag_player:
        condition: service_started
      description:
        condition: service_started
      imu_odom_kiss:
        condition: service_started
    volumes:
      - ${WORKSPACE}/scripts:${WORKSPACE}/scripts
    environment:
      KISS_POINTS_TOPIC: ${KISS_POINTS_TOPIC:-/hesai_lidar/points}
      KISS_INPUT_POINTS_TOPIC: ${KISS_INPUT_POINTS_TOPIC:-/kiss_icp/input_points}
      KISS_BASE_FRAME: ${KISS_BASE_FRAME:-base_footprint}
      KISS_LIDAR_ODOM_FRAME: ${KISS_LIDAR_ODOM_FRAME:-map}
      KISS_FIXED_PRIOR_FRAME: ${KISS_FIXED_PRIOR_FRAME:-odom}
      KISS_MOVING_PRIOR_FRAME: ${KISS_MOVING_PRIOR_FRAME:-base_footprint}
      KISS_USE_EXTERNAL_PRIOR: ${KISS_USE_EXTERNAL_PRIOR:-true}
      KISS_EXTERNAL_PRIOR_MAX_DT_S: ${KISS_EXTERNAL_PRIOR_MAX_DT_S:-1.2}
      KISS_EXTERNAL_PRIOR_LOOKUP_TIMEOUT_MS: ${KISS_EXTERNAL_PRIOR_LOOKUP_TIMEOUT_MS:-100}
      KISS_PUBLISH_ODOM_TF: ${KISS_PUBLISH_ODOM_TF:-false}
      KISS_PUBLISH_STATIC_MAP_TO_ODOM: ${KISS_PUBLISH_STATIC_MAP_TO_ODOM:-true}
      KISS_DATA_DESKEW: ${KISS_DATA_DESKEW:-true}
      KISS_PUBLISH_DEBUG_CLOUDS: ${KISS_PUBLISH_DEBUG_CLOUDS:-true}
      KISS_PUBLISH_TRAJECTORY_PATH: ${KISS_PUBLISH_TRAJECTORY_PATH:-true}
      KISS_FAIL_ON_RUNTIME_ODOM: ${KISS_FAIL_ON_RUNTIME_ODOM:-true}
      KISS_POSITION_COVARIANCE: ${KISS_POSITION_COVARIANCE:-0.10}
      KISS_ORIENTATION_COVARIANCE: ${KISS_ORIENTATION_COVARIANCE:-0.10}
      KISS_MAPPING_VOXEL_SIZE: ${KISS_MAPPING_VOXEL_SIZE:-1.0}
      KISS_MAX_RANGE: ${KISS_MAX_RANGE:-100.0}
      KISS_MIN_RANGE: ${KISS_MIN_RANGE:-0.0}
      KISS_ADAPTIVE_INITIAL_THRESHOLD: ${KISS_ADAPTIVE_INITIAL_THRESHOLD:-2.0}
      KISS_ADAPTIVE_MIN_MOTION_TH: ${KISS_ADAPTIVE_MIN_MOTION_TH:-0.1}
      KISS_MAX_NUM_ITERATIONS: ${KISS_MAX_NUM_ITERATIONS:-500}
      KISS_CONVERGENCE_CRITERION: ${KISS_CONVERGENCE_CRITERION:-0.0001}
      KISS_MAX_NUM_THREADS: ${KISS_MAX_NUM_THREADS:-0}
    command:
      - bash
      - -lc
      - |
        wait_for_topic() {
          topic="$$1"
          timeout_s="$$2"
          echo "Waiting for $$topic..."
          for i in $$(seq 1 "$$timeout_s"); do
            ros2 topic info "$$topic" 2>/dev/null | grep -qE "Publisher count: [1-9]" && return 0
            sleep 1
          done
          echo "ERROR: $$topic not available after $${timeout_s}s"
          return 1
        }
        wait_for_tf() {
          parent="$$1"
          child="$$2"
          timeout_s="$$3"
          echo "Waiting for TF $$parent -> $$child..."
          deadline=$$(( $$(date +%s) + timeout_s ))
          while [ "$$(date +%s)" -lt "$$deadline" ]; do
            if timeout 3 ros2 run tf2_ros tf2_echo "$$parent" "$$child" 2>&1 | grep -q "Translation"; then
              return 0
            fi
            sleep 1
          done
          return 1
        }

        wait_for_topic "$${KISS_POINTS_TOPIC}" 75 || exit 1
        if [ "$${KISS_FAIL_ON_RUNTIME_ODOM}" = "true" ]; then
          if ros2 topic info /mtt_odometry/runtime 2>/dev/null | grep -qE "Publisher count: [1-9]"; then
            echo "ERROR: /mtt_odometry/runtime is being published."
            echo "KISS-ICP profile must not run with runtime_odometry; it conflicts with imu_odom_kiss on odom -> base_footprint."
            echo "Run: docker compose stop runtime_odometry joint_state_builder"
            exit 3
          fi
        fi
        wait_for_tf "$${KISS_FIXED_PRIOR_FRAME}" "$${KISS_MOVING_PRIOR_FRAME}" 45 || {
          echo "ERROR: external prior TF $${KISS_FIXED_PRIOR_FRAME} -> $${KISS_MOVING_PRIOR_FRAME} not available."
          echo "Do not start runtime_odometry together with imu_odom."
          exit 2
        }

        if [ "$${KISS_PUBLISH_STATIC_MAP_TO_ODOM}" = "true" ] && [ "$${KISS_LIDAR_ODOM_FRAME}" = "map" ]; then
          # KISS publishes odometry in map frame; imu_odom owns odom -> base_footprint.
          # Identity map -> odom lets imu_odom consume /mapping/icp_odom without
          # KISS publishing a competing map/base TF.
          ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 map odom &
        fi

        # Transform input cloud (raw Hesai or externally merged cloud) to base frame.
        python3 ${WORKSPACE}/scripts/pointcloud_to_base_frame.py \
          --input-topic "$${KISS_POINTS_TOPIC}" \
          --output-topic "$${KISS_INPUT_POINTS_TOPIC}" &

        exec ros2 run kiss_icp kiss_icp_node --ros-args \
          -p base_frame:=$${KISS_BASE_FRAME} \
          -p lidar_odom_frame:=$${KISS_LIDAR_ODOM_FRAME} \
          -p publish_odom_tf:=$${KISS_PUBLISH_ODOM_TF} \
          -p invert_odom_tf:=false \
          -p publish_debug_clouds:=$${KISS_PUBLISH_DEBUG_CLOUDS} \
          -p publish_trajectory_path:=$${KISS_PUBLISH_TRAJECTORY_PATH} \
          -p use_sim_time:=true \
          -p use_external_prior:=$${KISS_USE_EXTERNAL_PRIOR} \
          -p external_prior_fixed_frame:=$${KISS_FIXED_PRIOR_FRAME} \
          -p external_prior_moving_frame:=$${KISS_MOVING_PRIOR_FRAME} \
          -p external_prior_max_dt_s:=$${KISS_EXTERNAL_PRIOR_MAX_DT_S} \
          -p external_prior_lookup_timeout_ms:=$${KISS_EXTERNAL_PRIOR_LOOKUP_TIMEOUT_MS} \
          -p position_covariance:=$${KISS_POSITION_COVARIANCE} \
          -p orientation_covariance:=$${KISS_ORIENTATION_COVARIANCE} \
          -p data.deskew:=$${KISS_DATA_DESKEW} \
          -p data.max_range:=$${KISS_MAX_RANGE} \
          -p data.min_range:=$${KISS_MIN_RANGE} \
          -p mapping.voxel_size:=$${KISS_MAPPING_VOXEL_SIZE} \
          -p adaptive_threshold.initial_threshold:=$${KISS_ADAPTIVE_INITIAL_THRESHOLD} \
          -p adaptive_threshold.min_motion_th:=$${KISS_ADAPTIVE_MIN_MOTION_TH} \
          -p registration.max_num_iterations:=$${KISS_MAX_NUM_ITERATIONS} \
          -p registration.convergence_criterion:=$${KISS_CONVERGENCE_CRITERION} \
          -p registration.max_num_threads:=$${KISS_MAX_NUM_THREADS} \
          --remap pointcloud_topic:=$${KISS_INPUT_POINTS_TOPIC} \
          --remap kiss/odometry:=/mapping/icp_odom \
          --remap kiss/trajectory_path:=/mapping/trajectory_path

  # ── WILN obstacle cloud regenerated in replay map frame ──
  # The bag may contain /wiln/obstacles from the live run, but those points
  # were published in the live robot's map frame. Rebuild them from LiDAR +
  # the current replay ICP map TF so Foxglove's fixed "map" frame is coherent.
  wiln_obstacles:
    <<: [*replay_base]
    profiles: ["mapping", "teach_repeat", "wiln_obstacles"]
    depends_on:
      mapping:
        condition: service_started
    environment:
      WILN_PARAMS_FILE: ${WILN_PARAMS_FILE:-${WORKSPACE}/demos/common/config/wiln.yaml}
    command:
      - bash
      - -lc
      - |
        wait_for_topic() {
          topic="$1"
          timeout_s="$2"
          label="$3"
          echo "Waiting for $$label ($$topic)..."
          for i in $$(seq 1 "$$timeout_s"); do
            ros2 topic info "$$topic" 2>/dev/null | grep -qE "Publisher count: [1-9]" && return 0
            sleep 1
          done
          echo "ERROR: $$label ($$topic) not available after $${timeout_s}s"
          return 1
        }
        wait_for_topic /mapping/icp_odom 120 "Norlab ICP odom" || \
          echo "WARN: starting WILN obstacles anyway; replay timing may make ICP appear later."
        wait_for_topic /hesai_lidar/points 120 "Hesai cloud" || \
          echo "WARN: starting WILN obstacles anyway; replay timing may make the cloud appear later."
        wait_for_topic /mapping/map 120 "Norlab map" || \
          echo "WARN: starting WILN obstacles anyway; map TF may appear after the node starts."
        echo "Starting WILN obstacles with params: $${WILN_PARAMS_FILE}"
        exec ros2 run wiln wiln_obstacle_node \
          --ros-args \
          --params-file "$${WILN_PARAMS_FILE}" \
          -p use_sim_time:=true

  # ── Lightweight cloud for Foxglove/debug in replay ──
  # Use this instead of visualizing raw /hesai_lidar/points when debugging
  # mapping/obstacles. It publishes a cropped, voxelized cloud.
  lidar_debug_cloud:
    <<: [*replay_base]
    profiles: ["mapping", "teach_repeat", "wiln_obstacles", "debug"]
    depends_on:
      bag_player:
        condition: service_started
    command:
      - python3
      - ${WORKSPACE}/scripts/pointcloud_voxel_debug.py
      - --ros-args
      - -p
      - use_sim_time:=true
      - -p
      - input_topic:=${LIDAR_DEBUG_INPUT_TOPIC:-/hesai_lidar/points}
      - -p
      - output_topic:=${LIDAR_DEBUG_OUTPUT_TOPIC:-/debug/hesai_points_voxel}
      - -p
      - voxel_size:=${LIDAR_DEBUG_VOXEL_SIZE:-0.30}
      - -p
      - max_rate_hz:=${LIDAR_DEBUG_MAX_RATE_HZ:-2.0}
      - -p
      - max_points:=${LIDAR_DEBUG_MAX_POINTS:-25000}

  audit_topics:
    <<: [*replay_base]
    profiles: ["debug", "mapping", "wiln_obstacles"]
    command:
      - python3
      - ${WORKSPACE}/scripts/audit_live_topics.py
      - --duration
      - ${AUDIT_DURATION:-30}

  audit_tf:
    <<: [*replay_base]
    profiles: ["debug", "mapping", "wiln_obstacles"]
    command:
      - python3
      - ${WORKSPACE}/scripts/audit_tf_chain.py
      - --duration
      - ${AUDIT_DURATION:-60}

  map_quality:
    <<: [*replay_base]
    profiles: ["debug", "mapping", "wiln_obstacles"]
    command:
      - python3
      - ${WORKSPACE}/scripts/icp_map_quality_check.py
      - --duration
      - ${AUDIT_DURATION:-120}

  # ── Post-process dataset export: ICP + lightweight enriched bag + CSV ──
  # Writes per session:
  #   <session>/offline_icp/map.vtk
  #   <session>/offline_icp/trajectory.vtk
  #   <session>/postprocess_dataset/dataset.csv
  #   <session>/postprocess_dataset/enriched_bag/  (trailer pose/markers/debug only)
  #   <session>/postprocess_dataset/summary.yaml
  # and a global ${WORKSPACE}/data/postprocess_dataset_report.yaml.
  #
  # Default full pass:
  #   docker compose --profile postprocess up postprocess_dataset
  #
  # One session:
  #   BAG_PATH=${WORKSPACE}/data/mtt_nominal_outside_2026-04-30_16-08-13 \
  #     docker compose --profile postprocess up postprocess_dataset
  postprocess_dataset:
    <<: [*replay_base]
    profiles: ["postprocess", "dataset"]
    volumes:
      - ${WORKSPACE}/data:${WORKSPACE}/data
      - ${BAG_PATH:-${WORKSPACE}/data}:${BAG_PATH:-${WORKSPACE}/data}
      - ${BAGS_ROOT:-/data/mtt_bags}:${BAGS_ROOT:-/data/mtt_bags}
    environment:
      BAG_PATH: ${BAG_PATH:-}
      BAGS_ROOT: ${BAGS_ROOT:-/data/mtt_bags}
      DATA_DIR: ${DATA_DIR:-/data/mtt_bags}
      POSTPROCESS_RUN_ICP: ${POSTPROCESS_RUN_ICP:-false}
      POSTPROCESS_RUN_LIVE_ICP: ${POSTPROCESS_RUN_LIVE_ICP:-true}
      POSTPROCESS_RUN_PERCEPTION: ${POSTPROCESS_RUN_PERCEPTION:-true}
      POSTPROCESS_RUN_ENRICHED_BAG: ${POSTPROCESS_RUN_ENRICHED_BAG:-true}
      POSTPROCESS_FORCE_ICP: ${POSTPROCESS_FORCE_ICP:-false}
      POSTPROCESS_FORCE_LIVE_ICP: ${POSTPROCESS_FORCE_LIVE_ICP:-false}
      POSTPROCESS_FORCE_PERCEPTION: ${POSTPROCESS_FORCE_PERCEPTION:-false}
      POSTPROCESS_FORCE_ENRICHED_BAG: ${POSTPROCESS_FORCE_ENRICHED_BAG:-false}
      POSTPROCESS_PREFER_OFFLINE_LIVE_ICP: ${POSTPROCESS_PREFER_OFFLINE_LIVE_ICP:-true}
      POSTPROCESS_LIVE_ICP_ODOM_SOURCE: ${POSTPROCESS_LIVE_ICP_ODOM_SOURCE:-auto}
      DATASET_ROS_DOMAIN_ID: ${DATASET_ROS_DOMAIN_ID:-}
      MAPPING_DATASET_MAP_PUBLISH_RATE: ${MAPPING_DATASET_MAP_PUBLISH_RATE:-0}
      MAPPING_DATASET_MAP_PUBLISH_RADIUS_M: ${MAPPING_DATASET_MAP_PUBLISH_RADIUS_M:-40.0}
      POSTPROCESS_QUALITY: ${POSTPROCESS_QUALITY:-max}
      REPLAY_RATE: ${REPLAY_RATE:-1.0}
      OFFLINE_ICP_MAX_REPLAY_RATE: ${OFFLINE_ICP_MAX_REPLAY_RATE:-0.25}
      OFFLINE_ICP_PLAYBACK_POLICY: ${OFFLINE_ICP_PLAYBACK_POLICY:-auto}
      OFFLINE_ICP_CLOUD_STRIDE: ${OFFLINE_ICP_CLOUD_STRIDE:-1}
    command:
      - bash
      - -lc
      - |
        INPUT_PATH="$${BAG_PATH:-$${DATA_DIR}}"
        ARGS=("$${INPUT_PATH}" "--quality" "$${POSTPROCESS_QUALITY}" "--replay-rate" "$${REPLAY_RATE}")
        if [ "$${POSTPROCESS_RUN_ICP}" = "true" ]; then
          ARGS+=("--run-icp")
        fi
        if [ "$${POSTPROCESS_RUN_LIVE_ICP}" = "true" ]; then
          ARGS+=("--run-live-icp" "--live-icp-odom-source" "$${POSTPROCESS_LIVE_ICP_ODOM_SOURCE}")
        fi
        if [ "$${POSTPROCESS_RUN_ENRICHED_BAG}" = "true" ]; then
          ARGS+=("--run-enriched-bag")
        fi
        if [ "$${POSTPROCESS_FORCE_ICP}" = "true" ]; then
          ARGS+=("--force-icp")
        fi
        if [ "$${POSTPROCESS_FORCE_LIVE_ICP}" = "true" ]; then
          ARGS+=("--force-live-icp")
        fi
        if [ "$${POSTPROCESS_PREFER_OFFLINE_LIVE_ICP}" = "true" ]; then
          ARGS+=("--prefer-offline-live-icp")
        fi
        if [ "$${POSTPROCESS_FORCE_ENRICHED_BAG}" = "true" ]; then
          ARGS+=("--force-enriched-bag")
        fi
        exec python3 -u ${WORKSPACE}/scripts/build_postprocess_dataset.py "$${ARGS[@]}"

  # ── Metadata-only audit: fast preflight, no ROS replay and no bag decoding ──
  postprocess_metadata:
    <<: [*replay_base]
    profiles: ["postprocess", "dataset", "metadata"]
    volumes:
      - ${WORKSPACE}/data:${WORKSPACE}/data
      - ${BAG_PATH:-${WORKSPACE}/data}:${BAG_PATH:-${WORKSPACE}/data}
      - ${BAGS_ROOT:-/data/mtt_bags}:${BAGS_ROOT:-/data/mtt_bags}
    environment:
      BAG_PATH: ${BAG_PATH:-}
      BAGS_ROOT: ${BAGS_ROOT:-/data/mtt_bags}
      DATA_DIR: ${DATA_DIR:-/data/mtt_bags}
    command:
      - bash
      - -lc
      - |
        INPUT_PATH="$${BAG_PATH:-$${DATA_DIR}}"
        exec python3 -u ${WORKSPACE}/scripts/build_postprocess_dataset.py "$${INPUT_PATH}" --metadata-only

  # ── Post-process audit: CSV integrity + physical consistency + plots ──
  # Reads existing postprocess_dataset outputs only. It does not replay bags,
  # does not run ICP, and does not record enriched bags.
  #
  # Writes per session:
  #   <session>/postprocess_dataset/audit.yaml
  #   <session>/postprocess_dataset/plots/*.png
  # and global:
  #   ${WORKSPACE}/data/postprocess_dataset_audit_report.yaml
  #   ${WORKSPACE}/data/postprocess_dataset_audit_summary.csv
  postprocess_audit:
    <<: [*replay_base]
    profiles: ["postprocess", "dataset", "audit"]
    volumes:
      - ${WORKSPACE}/data:${WORKSPACE}/data
      - ${BAG_PATH:-${WORKSPACE}/data}:${BAG_PATH:-${WORKSPACE}/data}
      - ${BAGS_ROOT:-/data/mtt_bags}:${BAGS_ROOT:-/data/mtt_bags}
    environment:
      BAG_PATH: ${BAG_PATH:-}
      BAGS_ROOT: ${BAGS_ROOT:-/data/mtt_bags}
      DATA_DIR: ${DATA_DIR:-/data/mtt_bags}
      POSTPROCESS_AUDIT_PLOTS: ${POSTPROCESS_AUDIT_PLOTS:-true}
      POSTPROCESS_AUDIT_STRICT: ${POSTPROCESS_AUDIT_STRICT:-false}
    command:
      - bash
      - -lc
      - |
        INPUT_PATH="$${BAG_PATH:-$${DATA_DIR}}"
        ARGS=("$${INPUT_PATH}")
        if [ "$${POSTPROCESS_AUDIT_PLOTS}" != "true" ]; then
          ARGS+=("--no-plots")
        fi
        if [ "$${POSTPROCESS_AUDIT_STRICT}" = "true" ]; then
          ARGS+=("--strict")
        fi
        exec python3 -u ${WORKSPACE}/scripts/audit_postprocess_dataset.py "$${ARGS[@]}"

  # ── ICP/mapping investigation: cross-bag consistency + plots ──
  # Reads existing postprocess outputs only by default. It does not replay bags.
  # Writes:
  #   <session>/icp_investigation/report.yaml
  #   <session>/icp_investigation/summary.md
  #   <session>/icp_investigation/plots/*.png
  #   ${WORKSPACE}/data/icp_investigation_report.yaml
  #   ${WORKSPACE}/data/icp_investigation_summary.csv
  postprocess_icp_investigation:
    <<: [*replay_base]
    profiles: ["postprocess", "dataset", "audit", "investigate"]
    volumes:
      - ${WORKSPACE}/data:${WORKSPACE}/data
      - ${BAG_PATH:-${WORKSPACE}/data}:${BAG_PATH:-${WORKSPACE}/data}
      - ${BAGS_ROOT:-/data/mtt_bags}:${BAGS_ROOT:-/data/mtt_bags}
    environment:
      BAG_PATH: ${BAG_PATH:-}
      BAGS_ROOT: ${BAGS_ROOT:-/data/mtt_bags}
      DATA_DIR: ${DATA_DIR:-/data/mtt_bags}
      ICP_INVESTIGATION_PLOTS: ${ICP_INVESTIGATION_PLOTS:-true}
      ICP_INVESTIGATION_TF: ${ICP_INVESTIGATION_TF:-false}
      ICP_INVESTIGATION_STRICT: ${ICP_INVESTIGATION_STRICT:-false}
    command:
      - bash
      - -lc
      - |
        INPUT_PATH="$${BAG_PATH:-$${DATA_DIR}}"
        ARGS=("$${INPUT_PATH}")
        if [ "$${ICP_INVESTIGATION_PLOTS}" != "true" ]; then
          ARGS+=("--no-plots")
        fi
        if [ "$${ICP_INVESTIGATION_TF}" = "true" ]; then
          ARGS+=("--inspect-tf")
        fi
        if [ "$${ICP_INVESTIGATION_STRICT}" = "true" ]; then
          ARGS+=("--strict")
        fi
        exec python3 -u ${WORKSPACE}/scripts/investigate_icp_mapping.py "$${ARGS[@]}"

  # ── Offline localization reference from CSV dataset ──
  # Converts postprocess_dataset/dataset.csv to the mtt_localization offline
  # solver input and runs offline_reference_solver. This is the bridge from the
  # database-style CSV exports to the factor-graph reference trajectory.
  postprocess_reference:
    <<: [*replay_base]
    profiles: ["postprocess", "dataset", "reference"]
    volumes:
      - ${WORKSPACE}/data:${WORKSPACE}/data
      - ${BAG_PATH:-${WORKSPACE}/data}:${BAG_PATH:-${WORKSPACE}/data}
      - ${BAGS_ROOT:-/data/mtt_bags}:${BAGS_ROOT:-/data/mtt_bags}
    environment:
      BAG_PATH: ${BAG_PATH:-}
      BAGS_ROOT: ${BAGS_ROOT:-/data/mtt_bags}
      DATA_DIR: ${DATA_DIR:-/data/mtt_bags}
      OFFLINE_REFERENCE_RUN_ICP: ${OFFLINE_REFERENCE_RUN_ICP:-false}
      OFFLINE_REFERENCE_FORCE_ICP: ${OFFLINE_REFERENCE_FORCE_ICP:-false}
    command:
      - bash
      - -lc
      - |
        INPUT_PATH="$${BAG_PATH:-$${DATA_DIR}}"
        ARGS=("$${INPUT_PATH}" "--from-postprocess-csv")
        if [ "$${OFFLINE_REFERENCE_RUN_ICP}" = "true" ]; then
          ARGS+=("--run-icp")
        fi
        if [ "$${OFFLINE_REFERENCE_FORCE_ICP}" = "true" ]; then
          ARGS+=("--force-icp")
        fi
        exec python3 -u ${WORKSPACE}/scripts/offline_reference.py "$${ARGS[@]}"

  # ── Sensor health check on bag output ──
  health_check:
    <<: [*replay_base]
    profiles: ["check"]
    depends_on:
      bag_player:
        condition: service_started
    environment:
      HEALTH_CHECK_DURATION: "20"
    command:
      - bash
      - -lc
      - |
        echo "Waiting 5s for bag player to settle..."
        sleep 5
        python3 ${WORKSPACE}/demos/data_collection/scripts/health_check.py

  # ── LiDAR-Camera colorizer for replay visualization ──
  # Projects ZED2i RGB onto the Hesai PointCloud2 and publishes
  # /hesai_lidar/points_colored (keeps intensity + adds rgb field).
  # Usage: BAG_PATH=... docker compose --profile colorizer up bag_player description colorizer foxglove
  colorizer:
    <<: [*replay_base]
    profiles: ["colorizer"]
    depends_on:
      bag_player:
        condition: service_started
      description:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        echo "Waiting for /clock and TF to settle..."
        sleep 3
        exec ros2 launch mtt_lidar_camera_colorizer colorizer.launch.py \
          use_sim_time:=true \
          image_transport:=compressed

  # ── Foxglove for replay visualization ──
  # Connect Foxglove Studio → "Open connection" → "Foxglove WebSocket" → ws://localhost:8765
  foxglove:
    <<: [*replay_base]
    depends_on:
      bag_player:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        fuser -k 8765/tcp 2>/dev/null || true
        sleep 0.3
        echo "Foxglove WebSocket bridge → ws://localhost:8765"
        exec ros2 run foxglove_bridge foxglove_bridge \
          --ros-args \
          --params-file ${WORKSPACE}/src/external/norlab_robot/config/_foxglove_bridge.yaml \
          -p port:=8765

  # ── RViz (optional — requires X11 display on host) ──
  # Usage (after stack is up): docker compose exec mapping rviz2 -d /workspace/config/replay_mapping.rviz
  # Or: DISPLAY=:0 docker compose run --no-deps --rm rviz
  rviz:
    <<: [*replay_base]
    profiles: ["rviz"]
    environment:
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${PWD}/config:/workspace/config:ro
    command:
      - rviz2
      - -d
      - /workspace/config/replay_mapping.rviz

  # ── Teach-and-Repeat stack for offline WILN validation ──
  #
  # Runs wiln_node + mtt_path_follower + mtt_repeat_supervisor on top of a bag.
  # Workflow:
  #   1. Start:  BAG_PATH=... docker compose up bag_player description foxglove teach_repeat
  #   2. Record: ros2 service call /start_recording std_srvs/srv/Empty '{}'
  #              (watch bag play → poses arrive via /mapping/icp_odom)
  #   3. Stop:   ros2 service call /stop_recording std_srvs/srv/Empty '{}'
  #   4. Save:   ros2 service call /save_map_traj wiln/srv/SaveMapTraj '{file_name: {data: /workspace/data/route.ltr}}'
  #   5. Load:   ros2 service call /load_map_traj wiln/srv/LoadMapTraj '{file_name: {data: /workspace/data/route.ltr}}'
  #   6. Play:   ros2 service call /play_line std_srvs/srv/Empty '{}'
  #              → visualise /wiln/markers + wiln/deformed_plan in Foxglove
  #   7. Cancel: ros2 service call /cancel_trajectory std_srvs/srv/Empty '{}'
  #
  # Note: path follower will not actually drive the robot (no CAN bus).
  # The goal is to validate trajectory capture, save/load round-trip,
  # and planning/deformation visualisation in Foxglove.
  teach_repeat:
    <<: [*replay_base]
    profiles: ["teach_repeat"]
    depends_on:
      bag_player:
        condition: service_started
      description:
        condition: service_started
      wiln_obstacles:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        echo "Waiting for /clock and ICP odom to settle..."
        sleep 4
        exec ros2 launch norlab_robot teach_repeat.launch.py \
          use_sim_time:=true \
          odom_topic:=/mapping/icp_odom \
          pose_topic:=/wiln/pose \
          wiln_cmd_vel_topic:=/cmd_vel \
          wiln_params_file:=${WORKSPACE}/demos/common/config/wiln.yaml \
          follower_params_file:=${WORKSPACE}/demos/common/config/mtt_path_follower.yaml \
          supervisor_params_file:=${WORKSPACE}/demos/common/config/mtt_repeat_supervisor.yaml \
          route_manager_params_file:=${WORKSPACE}/demos/common/config/mtt_route_manager.yaml \
          front_obstacle_params_file:=${WORKSPACE}/demos/common/config/mtt_front_obstacle_monitor.yaml \
          start_obstacle_node:=false

  wiln_validate_route:
    <<: [*replay_base]
    profiles: ["teach_repeat"]
    volumes:
      - ${WORKSPACE}/data:${WORKSPACE}/data
    environment:
      WILN_LTR_FILE: ${WILN_LTR_FILE:-${WORKSPACE}/data/route.ltr}
    command:
      - bash
      - -lc
      - |
        python3 ${WORKSPACE}/scripts/validate_wiln_route.py "$${WILN_LTR_FILE}"

  # ── Debug shell ──
  bash:
    <<: [*replay_base]
    profiles: ["debug"]
    volumes:
      - ${WORKSPACE}/data:${WORKSPACE}/data
    tty: true
    stdin_open: true
    command: bash
