      MAPPING_MIN_MAP_OVERLAP_LOOSE_RATIO: ${MATHIS_MAPPING_MIN_MAP_OVERLAP_LOOSE_RATIO:-0.50}
      MAPPING_MAX_MAP_UPDATE_TRANSLATION_CORRECTION_M: ${MATHIS_MAPPING_MAX_MAP_UPDATE_TRANSLATION_CORRECTION_M:-1.50}
