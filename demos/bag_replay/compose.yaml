      MAPPING_AGGRESSIVE_SPEED_MS: ${MATHIS_MAPPING_AGGRESSIVE_SPEED_MS:-2.0}
      MAPPING_AGGRESSIVE_YAW_RATE_DEG_S: ${MATHIS_MAPPING_AGGRESSIVE_YAW_RATE_DEG_S:-15.0}
      MAPPING_PIVOT_LINEAR_SPEED_MS: ${MATHIS_MAPPING_PIVOT_LINEAR_SPEED_MS:-0.75}
      MAPPING_PIVOT_YAW_RATE_DEG_S: ${MATHIS_MAPPING_PIVOT_YAW_RATE_DEG_S:-15.0}
      MAPPING_PIVOT_MAX_TRANSLATION_CORRECTION_M: ${MATHIS_MAPPING_PIVOT_MAX_TRANSLATION_CORRECTION_M:-0.45}
      MAPPING_ENABLE_ODOM_BRIDGE: ${MATHIS_MAPPING_ENABLE_ODOM_BRIDGE:-true}
      MAPPING_ODOM_BRIDGE_AFTER_REJECTIONS: ${MATHIS_MAPPING_ODOM_BRIDGE_AFTER_REJECTIONS:-0}
      MAPPING_ODOM_BRIDGE_MIN_SPEED_MS: ${MATHIS_MAPPING_ODOM_BRIDGE_MIN_SPEED_MS:-1.5}
      MAPPING_ENABLE_PLANAR_POSE_CONSTRAINT: ${MATHIS_MAPPING_ENABLE_PLANAR_POSE_CONSTRAINT:-false}
      MAPPING_PLANAR_POSE_MAX_Z_DRIFT_M: ${MATHIS_MAPPING_PLANAR_POSE_MAX_Z_DRIFT_M:-0.75}
      MAPPING_INPUT_QOS_RELIABLE: ${MATHIS_MAPPING_INPUT_QOS_RELIABLE:-true}
      MAPPING_ANCHOR_MAP_AT_INITIAL_ROBOT_POSE: ${MATHIS_MAPPING_ANCHOR_MAP_AT_INITIAL_ROBOT_POSE:-true}
      MAPPING_MAP_PUBLISH_RADIUS_M: ${MATHIS_MAPPING_MAP_PUBLISH_RADIUS_M:-40.0}
      MAPPING_ENABLE_DYNAMIC_TRAILER_SELF_FILTER: ${MATHIS_MAPPING_ENABLE_DYNAMIC_TRAILER_SELF_FILTER:-false}
      MAPPING_DYNAMIC_TRAILER_ARTICULATION_TOPIC: ${MATHIS_MAPPING_DYNAMIC_TRAILER_ARTICULATION_TOPIC:-/mtt_articulation_angle}
      MAPPING_DYNAMIC_TRAILER_STALE_TIMEOUT_S: ${MATHIS_MAPPING_DYNAMIC_TRAILER_STALE_TIMEOUT_S:-0.5}
      MAPPING_DYNAMIC_TRAILER_YAW_OFFSET_RAD: ${MATHIS_MAPPING_DYNAMIC_TRAILER_YAW_OFFSET_RAD:-3.141592653589793}
      MAPPING_DYNAMIC_TRAILER_YAW_SIGN: ${MATHIS_MAPPING_DYNAMIC_TRAILER_YAW_SIGN:--1.0}
      MAPPING_DYNAMIC_TRAILER_HITCH_X: ${MATHIS_MAPPING_DYNAMIC_TRAILER_HITCH_X:--1.45}
      MAPPING_DYNAMIC_TRAILER_HITCH_Y: ${MATHIS_MAPPING_DYNAMIC_TRAILER_HITCH_Y:--0.085}
      MAPPING_DYNAMIC_TRAILER_FRONT_OFFSET_M: ${MATHIS_MAPPING_DYNAMIC_TRAILER_FRONT_OFFSET_M:--0.15}
      MAPPING_DYNAMIC_TRAILER_REAR_OFFSET_M: ${MATHIS_MAPPING_DYNAMIC_TRAILER_REAR_OFFSET_M:-2.20}
      MAPPING_DYNAMIC_TRAILER_HALF_WIDTH_M: ${MATHIS_MAPPING_DYNAMIC_TRAILER_HALF_WIDTH_M:-1.20}
      MAPPING_DYNAMIC_TRAILER_Z_MIN_M: ${MATHIS_MAPPING_DYNAMIC_TRAILER_Z_MIN_M:--0.35}
      MAPPING_DYNAMIC_TRAILER_Z_MAX_M: ${MATHIS_MAPPING_DYNAMIC_TRAILER_Z_MAX_M:-2.50}
      MAPPING_ODOM_FRAME: ${MATHIS_MAPPING_ODOM_FRAME:-odom}
