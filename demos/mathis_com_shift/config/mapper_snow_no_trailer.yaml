input:
  # Filter self-returns within 0.5m (chassis/LiDAR cage) in sensor frame
  - MinDistDataPointsFilter:
      minDist: 0.5
      dim: -1

  - RandomSamplingDataPointsFilter:
      prob: 0.35

icp:
  matcher:
    KDTreeMatcher:
      knn: 5
      maxDist: 1.0
      epsilon: 1

  outlierFilters:
    - TrimmedDistOutlierFilter:
        ratio: 0.75

  errorMinimizer:
    PointToPlaneErrorMinimizer: 
      # force4DOF=1: optimize Yaw + XYZ only. Roll and Pitch follow the IMU/odom prior.
      # Essential in garages/corridors and flat ground to prevent Pitch/Roll drift.
      force4DOF: 1

  transformationCheckers:
    - DifferentialTransformationChecker:
        minDiffRotErr: 0.001
        minDiffTransErr: 0.01
        smoothLength: 4
    - CounterTransformationChecker:
        maxIterationCount: 30
    - BoundTransformationChecker:
        maxRotationNorm: 0.80
        maxTranslationNorm: 10.0

  inspector: NullInspector
  logger: NullLogger

post:
  - SurfaceNormalDataPointsFilter:
      knn: 10

mapper:
  updateCondition:
    type: distance
    value: 0.10

  mapperModule:
    - PointDistanceMapperModule:
        # 0.20m map resolution (matching norlab_ws validated garage/universal profile)
        minDistNewPoint: 0.20

  # 80 m: exploite le range utile outdoor du Hesai XT-32.
  # Features lointaines (bâtiments, arbres à 50-80 m) donnent des contraintes
  # d'orientation très stables — réduit le drift en yaw.
  # Était 30 m: perdait 85% de la surface visible disponible.
  #
  # Densité de points à 80 m (Hesai XT-32):
  #   Horizontal: résolution 0.33° → espacement = 80 * tan(0.33°) = 0.46 m
  #   Vertical: 32 faisceaux / 31° FoV → 0.97° → 80 * tan(0.97°) = 1.35 m
  #   Densité effective: ~1 pt / 0.62 m²
  #   Avec minDistNewPoint=0.05 m: TOUS les points à 80 m sont acceptés dans la map
  #   (densité << 1 pt/0.05²).
  #   Croissance map ring 30→80 m: π×(80²−30²) × (1/0.62) ≈ 27 000 pts/révolution complète.
  #   Le trimming périodique (mapper_node.cpp) borne la taille de la map ICP à 150K pts.
  sensorMaxRange: 80.0
