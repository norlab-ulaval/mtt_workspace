mtt_operator_input_node:
  ros__parameters:
    # Mathis ice/COM-shift profile only.
    # 5.56 m/s ~= 20 km/h, matching the physical CAN scaling in mtt_driver.yaml.
    max_linear_speed: 5.56
    max_angular_command: 0.4
    linear_deadband: 0.08
    angular_deadband: 0.05
    linear_expo: 1.0
    angular_expo: 1.1
    manual_activity_linear_threshold: 0.05
    manual_activity_angular_threshold: 0.05
    deadman_button_index: 5
    light_button_index: 2
    articulation_hold_button_index: 10
    steer_mode_switch_button_index: 4
    enable_steering_mode_switch: true
    use_software_pid: true
    linear_axis_index: 1
    angular_axis_index: 3
    brake_axis_index: 5
    estop_left_trigger_axis: 2
    estop_right_trigger_axis: 5
    estop_trigger_threshold: -0.10
    invert_linear_axis: false
    invert_angular_axis: false
    enable_brake_axis: true
    brake_axis_released: 1.0
    brake_axis_pressed: -1.0
    brake_full_fraction: 0.6
    joy_timeout_s: 0.25
    articulation_hold_mode_default: false
    articulation_hold_enabled: false
    articulation_hold_reset_on_deadman_release: true
    enable_com_mode_switch: true
    com_toggle_button_index: 7
    invert_com_steer: false
    com_short_press_max_s: 1.5
    com_long_press_min_s: 4.0
    # Mathis ice transient experiment.
    # Active only when the ice profile publishes the arm heartbeat. Deadman must
    # be held, and the operator must push the linear stick past the start
    # threshold once to choose the initial direction.
    enable_com_direction_switch: false
    com_direction_toggle_button_index: -1
    enable_ice_com_shift_experiment: true
    ice_com_shift_slip_ratio_topic: /ice_slip/slip_ratio
    ice_com_shift_arm_topic: /mtt_control/ice_com_shift_experiment_active
    ice_com_shift_arm_timeout_s: 0.5
    ice_com_shift_slip_timeout_s: 0.5
    ice_com_shift_speed_ms: 5.56
    ice_com_shift_start_axis_threshold: 0.70
    # Switch speed direction and COM limit when |slip_ratio| is almost gone.
    ice_com_shift_switch_abs_slip_below: 0.08
    ice_com_shift_switch_hold_s: 0.10
    ice_com_shift_min_phase_s: 0.50
    ice_com_shift_max_phase_s: 0.0
    # At the beginning of an experiment run, return COM to home briefly before
    # driving toward the selected limit. With Mathis rearm_slew=50000 and
    # amplitude_counts=5000, 0.15s is enough for a half-range return.
    ice_com_shift_park_home_on_start: true
    ice_com_shift_park_home_s: 0.15
    ice_com_shift_park_home_on_stop: true
    # Manual brake acts as an operator-requested phase switch: speed target flips
    # and COM is sent to the opposite side while the robot is decelerating.
    ice_com_shift_switch_on_brake: true
    ice_com_shift_brake_switch_threshold: 0.10
    ice_com_shift_invert_com_axis: false
    # Optional COM limit jitter: while holding the active side, oscillate inward
    # and back to the same limit. 0.25 means 100% -> 75% -> 100% of the active
    # side; set amplitude to 1.0 for full home-to-limit pulses.
    ice_com_shift_jitter_enabled: true
    ice_com_shift_jitter_amplitude: 0.25
    ice_com_shift_jitter_frequency_hz: 4.0

mtt_manual_cmd_filter_node:
  ros__parameters:
    input_topic: cmd_vel/manual_raw
    output_topic: cmd_vel/manual
    input_timeout_s: 0.4
    publish_rate_hz: 50.0
    # Aggressive snow/ice test profile. Keep this local to Mathis.
    linear_rise_rate: 20.0
    linear_fall_rate: 20.0
    angular_rise_rate: 2.5
    angular_fall_rate: 3.5
    immediate_angular_zero: true
    reversal_guard_threshold: 0.0
    decel_brake_gain: 0.20
    decel_brake_threshold: 0.05
    enable_dynamic_filter: false
    linear_omega_n: 8.0
    linear_zeta: 1.0
    angular_omega_n: 10.0
    angular_zeta: 1.0

mtt_mode_manager_node:
  ros__parameters:
    button_auto_index: 0
    button_manual_index: 3
    button_stop_index: 1
    startup_hold_s: 0.0
    publish_rate_hz: 20.0
    request_auto_service: mtt_control/request_auto
    request_manual_service: mtt_control/request_manual
    request_stop_service: mtt_control/request_stop

mtt_cmd_arbiter_node:
  ros__parameters:
    manual_cmd_topic: cmd_vel/manual
    auto_cmd_topic: controller/cmd_vel
    output_cmd_topic: cmd_vel
    source_topic: mtt_control/selected_source
    publish_rate_hz: 50.0
    manual_timeout_s: 0.5
    auto_timeout_s: 0.5
    mode_switch_hold_s: 0.15
    manual_requires_deadman: true
